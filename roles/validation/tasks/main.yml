---
# Validation - Post-install health checks

- name: Verify kubeconfig exists
  ansible.builtin.stat:
    path: "{{ install_dir }}/auth/kubeconfig"
  register: kubeconfig_stat
  tags:
    - validation

- name: Fail if kubeconfig missing
  ansible.builtin.fail:
    msg: "Kubeconfig not found at {{ install_dir }}/auth/kubeconfig. Run install first."
  when: not kubeconfig_stat.stat.exists
  tags:
    - validation

- name: Check cluster API reachability
  ansible.builtin.command:
    cmd: oc whoami --kubeconfig={{ install_dir }}/auth/kubeconfig
  register: oc_whoami
  changed_when: false
  tags:
    - validation

- name: Verify cluster operators are available
  ansible.builtin.command:
    cmd: oc get co --kubeconfig={{ install_dir }}/auth/kubeconfig -o jsonpath='{.items[?(@.status.conditions[?(@.type=="Available")].status!="True")].metadata.name}'
  register: degraded_operators
  changed_when: false
  failed_when: false
  tags:
    - validation

- name: Report degraded operators
  ansible.builtin.debug:
    msg: "Degraded operators: {{ degraded_operators.stdout }}"
  when: degraded_operators.stdout | length > 0
  tags:
    - validation

- name: Fail if critical operators are degraded
  ansible.builtin.fail:
    msg: "Some cluster operators are not available: {{ degraded_operators.stdout }}"
  when:
    - degraded_operators.stdout is defined
    - degraded_operators.stdout | length > 0
    - (degraded_operators.stdout | search('api')) or (degraded_operators.stdout | search('authentication'))
  tags:
    - validation

- name: Check node readiness
  ansible.builtin.command:
    cmd: oc get nodes --kubeconfig={{ install_dir }}/auth/kubeconfig -o jsonpath='{.items[?(@.status.conditions[?(@.type=="Ready")].status!="True")].metadata.name}'
  register: not_ready_nodes
  changed_when: false
  failed_when: false
  tags:
    - validation

- name: Report not ready nodes
  ansible.builtin.debug:
    msg: "Nodes not Ready: {{ not_ready_nodes.stdout }}"
  when: not_ready_nodes.stdout | length > 0
  tags:
    - validation

- name: Get cluster version
  ansible.builtin.command:
    cmd: oc get clusterversion version --kubeconfig={{ install_dir }}/auth/kubeconfig -o jsonpath='{.status.desired.version}'
  register: cluster_version
  changed_when: false
  tags:
    - validation

- name: Display validation summary
  ansible.builtin.debug:
    msg:
      - "Cluster version: {{ cluster_version.stdout }}"
      - "API: reachable"
      - "Operators: {{ 'OK' if (degraded_operators.stdout | length) == 0 else 'Check: ' + degraded_operators.stdout }}"
      - "Nodes: {{ 'OK' if (not_ready_nodes.stdout | length) == 0 else 'Check: ' + not_ready_nodes.stdout }}"
  tags:
    - validation
