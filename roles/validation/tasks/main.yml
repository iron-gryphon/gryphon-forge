---
# Validation - Post-install health checks

- name: Verify kubeconfig exists
  ansible.builtin.stat:
    path: "{{ validation_install_dir }}/auth/kubeconfig"
  register: validation_kubeconfig_stat
  tags:
    - validation

- name: Fail if kubeconfig missing
  ansible.builtin.fail:
    msg: "Kubeconfig not found at {{ validation_install_dir }}/auth/kubeconfig. Run install first."
  when: not validation_kubeconfig_stat.stat.exists
  tags:
    - validation

- name: Check cluster API reachability
  ansible.builtin.command:
    cmd: "{{ validation_oc_cmd }} whoami --kubeconfig={{ validation_install_dir }}/auth/kubeconfig"
  register: validation_oc_whoami
  changed_when: false
  tags:
    - validation

- name: Verify cluster operators are available
  ansible.builtin.command:
    cmd: >-
      {{ validation_oc_cmd }} get co --kubeconfig={{ validation_install_dir }}/auth/kubeconfig
      -o jsonpath='{.items[?(@.status.conditions[?(@.type=="Available")].status!="True")].metadata.name}'
  register: validation_degraded_operators
  changed_when: false
  failed_when: false
  tags:
    - validation

- name: Report degraded operators
  ansible.builtin.debug:
    msg: "Degraded operators: {{ validation_degraded_operators.stdout }}"
  when: validation_degraded_operators.stdout | length > 0
  tags:
    - validation

- name: Fail if critical operators are degraded
  ansible.builtin.fail:
    msg: "Some cluster operators are not available: {{ validation_degraded_operators.stdout }}"
  when:
    - validation_degraded_operators.stdout is defined
    - validation_degraded_operators.stdout | length > 0
    - (validation_degraded_operators.stdout | search('api'))
      or (validation_degraded_operators.stdout | search('authentication'))
  tags:
    - validation

- name: Check node readiness
  ansible.builtin.command:
    cmd: >-
      {{ validation_oc_cmd }} get nodes --kubeconfig={{ validation_install_dir }}/auth/kubeconfig
      -o jsonpath='{.items[?(@.status.conditions[?(@.type=="Ready")].status!="True")].metadata.name}'
  register: validation_not_ready_nodes
  changed_when: false
  failed_when: false
  tags:
    - validation

- name: Report not ready nodes
  ansible.builtin.debug:
    msg: "Nodes not Ready: {{ validation_not_ready_nodes.stdout }}"
  when: validation_not_ready_nodes.stdout | length > 0
  tags:
    - validation

- name: Get cluster version
  ansible.builtin.command:
    cmd: >-
      {{ validation_oc_cmd }} get clusterversion version --kubeconfig={{ validation_install_dir }}/auth/kubeconfig
      -o jsonpath='{.status.desired.version}'
  register: validation_cluster_version
  changed_when: false
  tags:
    - validation

- name: Display validation summary
  ansible.builtin.debug:
    msg:
      - "Cluster version: {{ validation_cluster_version.stdout }}"
      - "API: reachable"
      - >-
        Operators: {{ 'OK' if (validation_degraded_operators.stdout | length) == 0
        else 'Check: ' + validation_degraded_operators.stdout }}
      - >-
        Nodes: {{ 'OK' if (validation_not_ready_nodes.stdout | length) == 0
        else 'Check: ' + validation_not_ready_nodes.stdout }}
  tags:
    - validation
