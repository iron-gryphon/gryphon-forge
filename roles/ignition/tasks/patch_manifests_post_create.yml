---
# After openshift-install create manifests — align DNS operator with foundry private zone (AWS UPI / private clusters).
# Optionally patch default IngressController: Unmanaged DNS on LoadBalancer strategy, and/or HostNetwork publishing when Forge uses an NLB (no ACM/ALB).

- name: Resolve Route53 private hosted zone ID for manifest patches (unwrap Terraform output shape)
  ansible.builtin.set_fact:
    ignition_forge_private_zone_id: >-
      {{
        (foundry_internal_hosted_zone_id['value']
         if (foundry_internal_hosted_zone_id is mapping
             and (foundry_internal_hosted_zone_id | default({})).get('value') is defined)
         else foundry_internal_hosted_zone_id) | default('', true) | trim
      }}
  tags:
    - ignition

- name: Find candidate DNS manifest files from openshift-install
  ansible.builtin.find:
    paths: "{{ install_dir }}/manifests"
    patterns:
      - "cluster-dns*.yaml"
      - "cluster-dns*.yml"
    file_type: file
  register: ignition_dns_manifest_find
  tags:
    - ignition

- name: Resolve path to config.openshift.io DNS cluster manifest
  ansible.builtin.set_fact:
    ignition_dns_manifest_path: "{{ item.path }}"
  loop: "{{ ignition_dns_manifest_find.files | default([]) }}"
  vars:
    ignition_dns_manifest_doc: "{{ lookup('file', item.path) | from_yaml }}"
  when:
    - ignition_dns_manifest_path is not defined
    - (ignition_dns_manifest_doc.kind | default('')) == 'DNS'
    - ((ignition_dns_manifest_doc.metadata | default({})).name | default('')) == 'cluster'
  tags:
    - ignition

- name: Merge foundry private zone id into DNS cluster manifest
  when:
    - ignition_patch_dns_aws_private_zone | bool
    - ignition_forge_private_zone_id | length > 0
    - ignition_dns_manifest_path is defined
  tags:
    - ignition
  block:
    - name: Read DNS cluster manifest
      ansible.builtin.slurp:
        path: "{{ ignition_dns_manifest_path }}"
      register: ignition_dns_manifest_slurp

    - name: Parse DNS manifest for patching
      ansible.builtin.set_fact:
        ignition_dns_doc_in: "{{ ignition_dns_manifest_slurp.content | b64decode | from_yaml }}"

    # config.openshift.io DNS: private zone ID belongs in spec.privateZone (AWSDNSSpec has no privateZone field in 4.20+).
    # Writing spec.platform.aws.privateZone produced invalid YAML and bootstrap could skip applying DNS/cluster, breaking MCO.
    - name: Merge spec.privateZone.id for foundry Route53 zone (replace privateZone; preserve baseDomain, publicZone, platform)
      ansible.builtin.set_fact:
        ignition_dns_spec_new: "{{ ignition_dns_doc_in.spec | default({}) | combine({'privateZone': {'id': ignition_forge_private_zone_id}}) }}"

    - name: Build full patched DNS document
      ansible.builtin.set_fact:
        ignition_dns_manifest_patched: "{{ ignition_dns_doc_in | combine({'spec': ignition_dns_spec_new}, recursive=true) }}"

    - name: Write patched DNS cluster manifest
      ansible.builtin.copy:
        dest: "{{ ignition_dns_manifest_path }}"
        content: "{{ ignition_dns_manifest_patched | to_nice_yaml(indent=2) }}\n"
        mode: "0644"

- name: Fail when DNS private zone patch is required but DNS manifest was not found
  ansible.builtin.fail:
    msg: >-
      ignition_patch_dns_aws_private_zone is true and foundry_internal_hosted_zone_id is set, but no DNS/cluster manifest
      was found under {{ install_dir }}/manifests (expected cluster-dns-02-config.yml or cluster-dns*.y*ml). Re-run openshift-install
      create manifests or check install_dir.
  when:
    - ignition_patch_dns_aws_private_zone | bool
    - ignition_forge_private_zone_id | length > 0
    - ignition_dns_manifest_path is not defined
  tags:
    - ignition

- name: Find YAML manifests under openshift/ for default IngressController
  ansible.builtin.find:
    paths: "{{ install_dir }}/openshift"
    patterns:
      - "*.yml"
      - "*.yaml"
    file_type: file
  register: ignition_openshift_manifest_find
  tags:
    - ignition

- name: Resolve path to default IngressController manifest
  ansible.builtin.set_fact:
    ignition_ingresscontroller_manifest_path: "{{ item.path }}"
  loop: "{{ ignition_openshift_manifest_find.files | default([]) }}"
  vars:
    ignition_ingress_manifest_doc: "{{ lookup('file', item.path) | from_yaml }}"
  when:
    - ignition_ingresscontroller_manifest_path is not defined
    - (ignition_ingress_manifest_doc.kind | default('')) == 'IngressController'
    - ((ignition_ingress_manifest_doc.metadata | default({})).name | default('')) == 'default'
  tags:
    - ignition

- name: Find YAML manifests under manifests/ for default IngressController (installer layout fallback)
  ansible.builtin.find:
    paths: "{{ install_dir }}/manifests"
    patterns:
      - "*.yml"
      - "*.yaml"
    file_type: file
  register: ignition_cluster_manifest_find
  when: ignition_ingresscontroller_manifest_path is not defined
  tags:
    - ignition

- name: Resolve path to default IngressController manifest under manifests/
  ansible.builtin.set_fact:
    ignition_ingresscontroller_manifest_path: "{{ item.path }}"
  loop: "{{ (ignition_cluster_manifest_find | default({})).files | default([]) }}"
  vars:
    ignition_ingress_manifest_doc: "{{ lookup('file', item.path) | from_yaml }}"
  when:
    - ignition_ingresscontroller_manifest_path is not defined
    - (ignition_cluster_manifest_find | default({})).files | default([]) | length > 0
    - (ignition_ingress_manifest_doc.kind | default('')) == 'IngressController'
    - ((ignition_ingress_manifest_doc.metadata | default({})).name | default('')) == 'default'
  tags:
    - ignition

- name: Set flag when IngressController post-create patch is requested
  ansible.builtin.set_fact:
    ignition_ingress_patch_requested: >-
      {{
        (ignition_ingress_default_dns_management_unmanaged | bool)
        or (
          (ignition_ingress_endpoint_publishing_hostnetwork | bool)
          and (foundry_ingress_certificate_arn | default('') | length == 0)
        )
      }}
  tags:
    - ignition

- name: Patch default IngressController manifest (HostNetwork for Forge NLB and/or Unmanaged DNS)
  when:
    - ignition_ingresscontroller_manifest_path is defined
    - ignition_ingress_patch_requested | bool
  tags:
    - ignition
  block:
    - name: Read default IngressController manifest
      ansible.builtin.slurp:
        path: "{{ ignition_ingresscontroller_manifest_path }}"
      register: ignition_ingress_ic_slurp

    - name: Parse IngressController manifest for patching
      ansible.builtin.set_fact:
        ignition_ingress_ic_in: "{{ ignition_ingress_ic_slurp.content | b64decode | from_yaml }}"

    - name: Build endpointPublishingStrategy (HostNetwork when NLB path, else merge Unmanaged into existing LoadBalancer strategy)
      ansible.builtin.set_fact:
        ignition_ingress_eps_new: "{{ _strategy }}"
      vars:
        ignition_ingress_eps_in: "{{ (ignition_ingress_ic_in.spec | default({})).endpointPublishingStrategy | default({}) }}"
        ignition_ingress_lb_in: "{{ ignition_ingress_eps_in.loadBalancer | default({}) }}"
        ignition_ingress_lb_new: "{{ ignition_ingress_lb_in | combine({'dnsManagementPolicy': 'Unmanaged'}, recursive=true) }}"
        ignition_ingress_nlb_hostnetwork: >-
          {{
            (ignition_ingress_endpoint_publishing_hostnetwork | bool)
            and (foundry_ingress_certificate_arn | default('') | length == 0)
          }}
        _eps_hostnet:
          type: HostNetwork
          hostNetwork:
            httpPort: "{{ ignition_ingress_hostnetwork_http_port | int }}"
            httpsPort: "{{ ignition_ingress_hostnetwork_https_port | int }}"
        _eps_unmanaged_lb: "{{ ignition_ingress_eps_in | combine({'loadBalancer': ignition_ingress_lb_new}, recursive=true) }}"
        _strategy: "{{ _eps_hostnet if ignition_ingress_nlb_hostnetwork else _eps_unmanaged_lb }}"

    - name: Merge endpointPublishingStrategy into IngressController spec
      ansible.builtin.set_fact:
        ignition_ingress_ic_spec_new: >-
          {{
            ignition_ingress_ic_in.spec | default({})
            | combine({'endpointPublishingStrategy': ignition_ingress_eps_new}, recursive=true)
          }}

    - name: Set NLB HostNetwork path flag for router replica merge
      ansible.builtin.set_fact:
        ignition_ingress_nlb_hostnetwork: >-
          {{
            (ignition_ingress_endpoint_publishing_hostnetwork | bool)
            and (foundry_ingress_certificate_arn | default('') | length == 0)
          }}

    - name: Merge spec.replicas into IngressController spec (Forge NLB HostNetwork)
      when:
        - ignition_ingress_hostnetwork_router_replicas_merge | bool
        - ignition_ingress_nlb_hostnetwork | bool
      ansible.builtin.set_fact:
        ignition_ingress_ic_spec_new: >-
          {{
            ignition_ingress_ic_spec_new | combine({
              'replicas': (
                (ignition_ingress_hostnetwork_router_replicas | default('', true) | trim | length > 0)
                | ternary(
                    ignition_ingress_hostnetwork_router_replicas | int,
                    [2, (worker_count | default(0) | int) + (gpu_worker_count | default(0) | int)] | max
                  )
              )
            }, recursive=true)
          }}

    - name: Build full patched IngressController document
      ansible.builtin.set_fact:
        ignition_ingress_ic_patched: "{{ ignition_ingress_ic_in | combine({'spec': ignition_ingress_ic_spec_new}, recursive=true) }}"

    - name: Write patched default IngressController manifest
      ansible.builtin.copy:
        dest: "{{ ignition_ingresscontroller_manifest_path }}"
        content: "{{ ignition_ingress_ic_patched | to_nice_yaml(indent=2) }}\n"
        mode: "0644"

- name: Warn when IngressController patch is requested but default manifest was not found
  ansible.builtin.debug:
    msg: >-
      An IngressController patch was requested (Unmanaged DNS and/or HostNetwork for Forge NLB) but no IngressController/default manifest was found
      under {{ install_dir }}/openshift or {{ install_dir }}/manifests — skipping patch (installer layout may differ for this version).
  when:
    - ignition_ingresscontroller_manifest_path is not defined
    - ignition_ingress_patch_requested | bool
  tags:
    - ignition
