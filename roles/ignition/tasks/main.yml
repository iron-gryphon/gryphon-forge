---
# Ignition role - Generate OpenShift ignition files for UPI
# Wraps openshift-install create manifests/ignition-configs

- name: Validate prerequisites
  ansible.builtin.assert:
    that:
      - cluster_name | length > 0
      - base_domain | length > 0
      - foundry_private_subnets | length >= 3
    fail_msg: "cluster_name, base_domain, and foundry_private_subnets (min 3) are required"
  tags:
    - ignition
    - config

- name: Ensure install directory exists
  ansible.builtin.file:
    path: "{{ install_dir }}"
    state: directory
    mode: "0755"
  tags:
    - ignition
    - config

- name: Resolve pull secret path
  ansible.builtin.set_fact:
    ignition_pull_secret_resolved: "{{ pull_secret_path | expanduser }}"
  tags:
    - ignition

- name: Verify pull secret exists
  ansible.builtin.stat:
    path: "{{ ignition_pull_secret_resolved }}"
  register: ignition_pull_secret_stat
  tags:
    - ignition

- name: Fail if pull secret is missing
  ansible.builtin.fail:
    msg: "Pull secret not found at {{ ignition_pull_secret_resolved }}. Set PULL_SECRET_PATH or place at ~/.openshift/pull-secret"
  when: not ignition_pull_secret_stat.stat.exists
  tags:
    - ignition

- name: Resolve SSH public key path
  ansible.builtin.set_fact:
    ignition_ssh_key_resolved: "{{ ssh_public_key_path | expanduser }}"
  tags:
    - ignition

- name: Read SSH public key
  ansible.builtin.slurp:
    src: "{{ ignition_ssh_key_resolved }}"
  register: ignition_ssh_key_content
  tags:
    - ignition

- name: Set SSH key for install-config
  ansible.builtin.set_fact:
    ignition_ssh_key_data: "{{ ignition_ssh_key_content.content | b64decode | trim }}"
  tags:
    - ignition

- name: Read pull secret
  ansible.builtin.slurp:
    src: "{{ ignition_pull_secret_resolved }}"
  register: ignition_pull_secret_content
  tags:
    - ignition

- name: Set pull secret for install-config
  ansible.builtin.set_fact:
    ignition_pull_secret_data: "{{ ignition_pull_secret_content.content | b64decode }}"
  tags:
    - ignition

- name: Create install-config.yaml
  ansible.builtin.template:
    src: install-config.yaml.j2
    dest: "{{ install_dir }}/install-config.yaml"
    mode: "0600"
  tags:
    - ignition
    - config

- name: Create manifests (modify for UPI)
  ansible.builtin.command:
    cmd: openshift-install create manifests --dir={{ install_dir }}
    creates: "{{ install_dir }}/manifests/cluster-scheduler-02-config.yml"
  environment:
    HOME: "{{ ansible_facts['env']['HOME'] | default('/tmp') }}"
    AWS_REGION: "{{ foundry_region }}"
    AWS_DEFAULT_REGION: "{{ foundry_region }}"
  register: ignition_create_manifests
  changed_when: ignition_create_manifests.rc == 0
  tags:
    - ignition

- name: Remove master/worker machine pools from manifests (UPI - we provision nodes ourselves)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ install_dir }}/openshift/99_openshift-cluster-api_master-machines.yaml"
    - "{{ install_dir }}/openshift/99_openshift-cluster-api_worker-machineset.yaml"
  tags:
    - ignition

- name: Add ImageContentSourcePolicy manifest (disconnected install)
  ansible.builtin.copy:
    dest: "{{ install_dir }}/manifests/image-content-source-policy.yaml"
    content: |
      apiVersion: operator.openshift.io/v1alpha1
      kind: ImageContentSourcePolicy
      metadata:
        name: mirror-registry
      spec:
        repositoryDigestMirrors:
        - mirrors:
          - {{ mirror_registry_url | trim }}/{{ mirror_registry_release_path | default('openshift/release') }}
          source: quay.io/openshift-release-dev/ocp-release
        - mirrors:
          - {{ mirror_registry_url | trim }}/{{ mirror_registry_release_path | default('openshift/release') }}
          source: quay.io/openshift-release-dev/ocp-v4.0-art-dev
  when: mirror_registry_url | default('') | length > 0
  tags:
    - ignition

- name: Generate ignition configs
  ansible.builtin.command:
    cmd: openshift-install create ignition-configs --dir={{ install_dir }}
    creates: "{{ install_dir }}/worker.ign"
  environment:
    HOME: "{{ ansible_facts['env']['HOME'] | default('/tmp') }}"
    AWS_REGION: "{{ foundry_region }}"
    AWS_DEFAULT_REGION: "{{ foundry_region }}"
  register: ignition_create_ignition
  changed_when: ignition_create_ignition.rc == 0
  tags:
    - ignition

- name: Record ignition generation completion
  ansible.builtin.set_fact:
    ignition_generated: true
  tags:
    - ignition
