---
# Ignition role - Generate OpenShift ignition files for UPI
# Wraps openshift-install create manifests/ignition-configs

- name: Validate prerequisites
  ansible.builtin.assert:
    that:
      - cluster_name | length > 0
      - base_domain | length > 0
      - foundry_private_subnets | length >= 3
    fail_msg: "cluster_name, base_domain, and foundry_private_subnets (min 3) are required"
  tags:
    - ignition
    - config

- name: Ensure install directory exists
  ansible.builtin.file:
    path: "{{ install_dir }}"
    state: directory
    mode: "0755"
  tags:
    - ignition
    - config

- name: Resolve pull secret path
  ansible.builtin.set_fact:
    pull_secret_resolved: "{{ pull_secret_path | expand_user }}"
  tags:
    - ignition

- name: Verify pull secret exists
  ansible.builtin.stat:
    path: "{{ pull_secret_resolved }}"
  register: pull_secret_stat
  tags:
    - ignition

- name: Fail if pull secret is missing
  ansible.builtin.fail:
    msg: "Pull secret not found at {{ pull_secret_resolved }}. Set PULL_SECRET_PATH or place at ~/.openshift/pull-secret"
  when: not pull_secret_stat.stat.exists
  tags:
    - ignition

- name: Resolve SSH public key path
  ansible.builtin.set_fact:
    ssh_key_resolved: "{{ ssh_public_key_path | expand_user }}"
  tags:
    - ignition

- name: Read SSH public key
  ansible.builtin.slurp:
    src: "{{ ssh_key_resolved }}"
  register: ssh_key_content
  tags:
    - ignition

- name: Set SSH key for install-config
  ansible.builtin.set_fact:
    ssh_key_data: "{{ ssh_key_content.content | b64decode | trim }}"
  tags:
    - ignition

- name: Read pull secret
  ansible.builtin.slurp:
    src: "{{ pull_secret_resolved }}"
  register: pull_secret_content
  tags:
    - ignition

- name: Set pull secret for install-config
  ansible.builtin.set_fact:
    pull_secret_data: "{{ pull_secret_content.content | b64decode }}"
  tags:
    - ignition

- name: Create install-config.yaml
  ansible.builtin.copy:
    dest: "{{ install_dir }}/install-config.yaml"
    content: |
      apiVersion: v1
      baseDomain: {{ base_domain }}
      metadata:
        name: {{ cluster_name }}
      platform:
        aws:
          region: {{ foundry_region }}
          subnets: {{ foundry_private_subnets }}
      pullSecret: '{{ pull_secret_data }}'
      sshKey: |
        {{ ssh_key_data }}
      controlPlane:
        name: master
        replicas: {{ master_count }}
        platform:
          aws:
            type: {{ master_instance_type }}
      compute:
        - name: worker
          replicas: {{ worker_count }}
          platform:
            aws:
              type: {{ worker_instance_type }}
    mode: "0600"
  tags:
    - ignition
    - config

- name: Create manifests (modify for UPI)
  ansible.builtin.command:
    cmd: openshift-install create manifests --dir={{ install_dir }}
    creates: "{{ install_dir }}/manifests/cluster-scheduler-02-config.yml"
  environment:
    HOME: "{{ ansible_env.HOME | default('/tmp') }}"
  register: create_manifests
  changed_when: create_manifests.rc == 0
  tags:
    - ignition

- name: Remove master/worker machine pools from manifests (UPI - we provision nodes ourselves)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ install_dir }}/openshift/99_openshift-cluster-api_master-machines.yaml"
    - "{{ install_dir }}/openshift/99_openshift-cluster-api_worker-machineset.yaml"
  tags:
    - ignition

- name: Generate ignition configs
  ansible.builtin.command:
    cmd: openshift-install create ignition-configs --dir={{ install_dir }}
    creates: "{{ install_dir }}/bootstrap.ign"
  environment:
    HOME: "{{ ansible_env.HOME | default('/tmp') }}"
  register: create_ignition
  changed_when: create_ignition.rc == 0
  tags:
    - ignition

- name: Record ignition generation completion
  ansible.builtin.set_fact:
    ignition_generated: true
  tags:
    - ignition
