---
# Ignition role - Generate OpenShift ignition files for UPI
# Wraps openshift-install create manifests/ignition-configs

- name: Validate prerequisites
  ansible.builtin.assert:
    that:
      - cluster_name | length > 0
      - base_domain | length > 0
      - foundry_private_subnets | length >= 3
    fail_msg: "cluster_name, base_domain, and foundry_private_subnets (min 3) are required"
  tags:
    - ignition
    - config

- name: Ensure install directory exists
  ansible.builtin.file:
    path: "{{ install_dir }}"
    state: directory
    mode: "0755"
  tags:
    - ignition
    - config

- name: Ensure controller openshift-install and oc match bastion mirror channel
  ansible.builtin.include_tasks: ensure_openshift_install.yml
  tags:
    - ignition
    - config

# Unwrap Terraform output format ({sensitive, type, value}) when passed via -e @foundry_output.json
- name: Resolve mirror_registry_url (unwrap Terraform output format)
  ansible.builtin.set_fact:
    # Strip optional https:// — unquoted "https://host/..." in install-config YAML is parsed as a mapping (https: key).
    ignition_mirror_registry_url_resolved: >-
      {{ (mirror_registry_url['value'] if (mirror_registry_url is mapping
         and (mirror_registry_url | default({})).get('value') is defined)
         else (mirror_registry_url | default(''))) | trim | regex_replace('^https?://', '') }}
  tags:
    - ignition

- name: Resolve pull secret path
  ansible.builtin.set_fact:
    ignition_pull_secret_resolved: "{{ pull_secret_path | expanduser }}"
  tags:
    - ignition

- name: Verify pull secret exists
  ansible.builtin.stat:
    path: "{{ ignition_pull_secret_resolved }}"
  register: ignition_pull_secret_stat
  tags:
    - ignition

- name: Fail if pull secret is missing
  ansible.builtin.fail:
    msg: "Pull secret not found at {{ ignition_pull_secret_resolved }}. Set PULL_SECRET_PATH or place at ~/.openshift/pull-secret"
  when: not ignition_pull_secret_stat.stat.exists
  tags:
    - ignition

- name: Fail when mirror tag discovery is enabled without mirror_registry_url
  ansible.builtin.fail:
    msg: >-
      ignition_mirror_discover_release_tag is true but mirror_registry_url is empty.
      Set mirror_registry_url or disable ignition_mirror_discover_release_tag.
  when:
    - ignition_mirror_discover_release_tag | default(false) | bool
    - ignition_mirror_registry_url_resolved | default('') | length == 0
  tags:
    - ignition
    - config

- name: Fail when mirror tag discovery conflicts with manual openshift_install_release_image_override
  ansible.builtin.fail:
    msg: >-
      Set either ignition_mirror_discover_release_tag: true (discover highest tag on mirror) OR
      openshift_install_release_image_override (manual digest/tag), not both.
      Clear openshift_install_release_image_override or set ignition_mirror_discover_release_tag: false.
  when:
    - ignition_mirror_discover_release_tag | default(false) | bool
    - openshift_install_release_image_override | default('') | trim | length > 0
  tags:
    - ignition
    - config

- name: Discover openshift_install_release_image_override tag from mirror registry
  ansible.builtin.include_tasks: mirror_discover_release_tag.yml
  when:
    - ignition_mirror_registry_url_resolved | default('') | length > 0
    - ignition_mirror_discover_release_tag | default(false) | bool
  tags:
    - ignition
    - config

- name: Require openshift_install_release_image_override when using a mirror registry
  ansible.builtin.assert:
    that:
      - openshift_install_release_image_override | default('') | trim | length > 0
    fail_msg: >-
      Disconnected install: mirror_registry_url is set but openshift_install_release_image_override is empty.
      Either set openshift_install_release_image_override to the mirrored release (digest recommended), or set
      ignition_mirror_discover_release_tag: true to pick the highest tag matching ocp_version on the mirror (see inventory).
      Manual: oc-mirror / oc adm release mirror to
      {{ ignition_mirror_registry_url_resolved }}/{{ mirror_registry_release_path | default('openshift/release') }}.
      See inventory/group_vars/all.yml (Disconnected Install / mirror_registry_* variables).
  when:
    - ignition_mirror_registry_url_resolved | default('') | length > 0
    - not (ignition_mirror_discover_release_tag | default(false) | bool)
  tags:
    - ignition
    - config

- name: Verify mirrored release image from controller when bastion did not run preflight
  ansible.builtin.include_tasks: mirror_release_image_check.yml
  vars:
    # Private registry DNS (e.g. mirror.fsi.internal) is only resolvable from the VPC; use bastion when present.
    ignition_mirror_release_image_check_from_bastion: "{{ (groups['bastion'] | default([]) | length > 0) | bool }}"
  when:
    - ignition_mirror_registry_url_resolved | default('') | length > 0
    - openshift_install_release_image_override | default('') | trim | length > 0
    - ignition_mirror_release_image_check_enabled | default(true) | bool
    - not (hostvars['localhost']['ignition_mirror_preflight_completed'] | default(false) | bool)
  tags:
    - ignition
    - config

- name: Resolve SSH public key path
  ansible.builtin.set_fact:
    ignition_ssh_key_resolved: "{{ ssh_public_key_path | expanduser }}"
  tags:
    - ignition

- name: Read SSH public key
  ansible.builtin.slurp:
    src: "{{ ignition_ssh_key_resolved }}"
  register: ignition_ssh_key_content
  tags:
    - ignition

- name: Set SSH key for install-config
  ansible.builtin.set_fact:
    ignition_ssh_key_data: "{{ ignition_ssh_key_content.content | b64decode | trim }}"
  tags:
    - ignition

- name: Read pull secret
  ansible.builtin.slurp:
    src: "{{ ignition_pull_secret_resolved }}"
  register: ignition_pull_secret_content
  tags:
    - ignition

- name: Set pull secret for install-config
  ansible.builtin.set_fact:
    ignition_pull_secret_data: "{{ ignition_pull_secret_content.content | b64decode }}"
  tags:
    - ignition

- name: Create install-config.yaml
  ansible.builtin.template:
    src: install-config.yaml.j2
    dest: "{{ install_dir }}/install-config.yaml"
    mode: "0600"
  tags:
    - ignition
    - config

- name: Build environment for openshift-install (disconnected release override optional)
  ansible.builtin.set_fact:
    ignition_openshift_install_env:
      HOME: "{{ ansible_facts['env']['HOME'] | default('/tmp') }}"
      AWS_REGION: "{{ foundry_region }}"
      AWS_DEFAULT_REGION: "{{ foundry_region }}"
  tags:
    - ignition

- name: Add OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE for mirrored payload
  ansible.builtin.set_fact:
    ignition_openshift_install_env: "{{ ignition_openshift_install_env | combine(_ignition_release_override) }}"
  vars:
    _ignition_release_override:
      OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE: "{{ openshift_install_release_image_override }}"
  when: openshift_install_release_image_override | default('') | length > 0
  tags:
    - ignition

- name: Create manifests (modify for UPI)
  ansible.builtin.command:
    cmd: "{{ openshift_install_cmd }} create manifests --dir={{ install_dir }}"
  environment: "{{ ignition_openshift_install_env }}"
  register: ignition_create_manifests
  changed_when: ignition_create_manifests.rc == 0
  tags:
    - ignition

# openshift-install emits per-zone filenames (e.g. master-machines-0.yaml), not the legacy single-file names.
# See openshift/installer docs/user/aws/install_upi.md — leaving these in breaks Machine API vs UPI and can stall bootstrap (incl. CNI/OVN).
- name: Find Machine / MachineSet manifests to strip for UPI
  ansible.builtin.find:
    paths: "{{ install_dir }}/openshift"
    patterns:
      - "99_openshift-cluster-api_master-machines*.yaml"
      - "99_openshift-cluster-api_worker-machineset*.yaml"
      - "99_openshift-machine-api_master-control-plane-machine-set.yaml"
    file_type: file
  register: ignition_upi_machine_manifests
  tags:
    - ignition

- name: Remove Machine / MachineSet manifests (UPI - Forge provisions EC2 + ignition)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ ignition_upi_machine_manifests.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  tags:
    - ignition

- name: Find cluster scheduler manifest for UPI patch
  ansible.builtin.find:
    paths: "{{ install_dir }}/manifests"
    patterns: "cluster-scheduler-02-config.y*ml"
    file_type: file
  register: ignition_cluster_scheduler_manifests
  tags:
    - ignition

- name: Prefer control-plane unschedulable for app workloads (UPI scheduler manifest)
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '(?m)^(\s*mastersSchedulable:\s*)true\s*$'
    replace: '\1false'
  loop: "{{ ignition_cluster_scheduler_manifests.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  tags:
    - ignition

- name: Add ImageDigestMirrorSet manifest (disconnected install)
  ansible.builtin.template:
    src: image-digest-mirror-set.yaml.j2
    dest: "{{ install_dir }}/manifests/image-digest-mirror-set.yaml"
    mode: "0644"
  when:
    - ignition_mirror_registry_url_resolved | default('') | length > 0
    - mirror_registry_use_image_digest_sources | default(true) | bool
  tags:
    - ignition

- name: Add ImageContentSourcePolicy manifest (disconnected install, legacy)
  ansible.builtin.template:
    src: image-content-source-policy.yaml.j2
    dest: "{{ install_dir }}/manifests/image-content-source-policy.yaml"
    mode: "0644"
  when:
    - ignition_mirror_registry_url_resolved | default('') | length > 0
    - not (mirror_registry_use_image_digest_sources | default(true) | bool)
  tags:
    - ignition

- name: Generate ignition configs
  ansible.builtin.command:
    cmd: "{{ openshift_install_cmd }} create ignition-configs --dir={{ install_dir }}"
  environment: "{{ ignition_openshift_install_env }}"
  register: ignition_create_ignition
  changed_when: ignition_create_ignition.rc == 0
  tags:
    - ignition

- name: Record ignition generation completion
  ansible.builtin.set_fact:
    ignition_generated: true
  tags:
    - ignition
