---
# AWS Nodes role defaults
# Override ec2_key_name and rhcos_ami_id in group_vars

# OpenShift installer infraID for kubernetes.io/cluster/<infraID>=owned on EC2 (AWS CCM ClusterID). Empty = read infraID from install_dir/metadata.json.
aws_nodes_openshift_infrastructure_id: ""

# ELB target registration: retries when using EC2 describe (e.g. --tags load_balancers) — tag filters can lag after launch
aws_nodes_lb_target_discovery_retries: 40
aws_nodes_lb_target_discovery_delay: 8

# After NLB/TG tasks, write AWS + optional bastion diagnostics under this directory (timestamped subfolder)
aws_nodes_lb_validation_enabled: true
aws_nodes_lb_validation_log_dir: "{{ install_dir }}/forge-lb-validation"
# When true, LB validation writes bastion-diagnostics.txt during aws_nodes. Default false — csr_approver runs
# the same probes only when a CSR/bootstrap/install-complete task fails (see bastion_lb_diagnostics.yml).
aws_nodes_lb_validation_from_bastion: false
