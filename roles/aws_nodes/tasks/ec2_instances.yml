---
# EC2 instances for OpenShift UPI - bootstrap, masters, workers, GPU workers
# Requires rhcos_ami_id - get from: openshift-install coreos print-stream-json | jq -r '.architectures.x86_64.images.aws.regions["REGION"].image'
# Ignition configs are uploaded to S3 and referenced via stub (AWS user data limit 16KB)

- name: Set up S3-backed ignition (bucket, IAM, upload)
  ansible.builtin.include_tasks: ec2_ignition_s3.yml
  tags:
    - aws_nodes
    - ec2

# AWS cloud-controller-manager resolves ClusterID from EC2 tags kubernetes.io/cluster/<infraID> (or legacy KubernetesCluster).
# infraID must match openshift-install metadata.json (same value as install-config/cluster identity).
- name: Stat OpenShift installer metadata.json
  ansible.builtin.stat:
    path: "{{ install_dir }}/metadata.json"
  register: aws_nodes_metadata_json_stat
  tags:
    - aws_nodes
    - ec2

- name: Load installer metadata when infra ID not set explicitly
  ansible.builtin.include_vars:
    file: "{{ install_dir }}/metadata.json"
    name: aws_nodes_install_metadata
  when:
    - aws_nodes_openshift_infrastructure_id | default('') | trim | length == 0
    - aws_nodes_metadata_json_stat.stat.exists | default(false)
  tags:
    - aws_nodes
    - ec2

- name: Resolve OpenShift infrastructure ID for EC2 resource tags
  ansible.builtin.set_fact:
    aws_nodes_openshift_infrastructure_id_resolved: >-
      {{
        (aws_nodes_openshift_infrastructure_id | default('') | trim)
        if (aws_nodes_openshift_infrastructure_id | default('') | trim | length > 0)
        else ((aws_nodes_install_metadata | default({})).infraID | default(''))
      }}
  tags:
    - aws_nodes
    - ec2

- name: Assert OpenShift infrastructure ID is available for AWS CCM EC2 tags
  ansible.builtin.assert:
    that:
      - aws_nodes_openshift_infrastructure_id_resolved | length > 0
    fail_msg: >-
      Cannot resolve OpenShift infraID for kubernetes.io/cluster/* EC2 tags (AWS CCM ClusterID).
      Set aws_nodes_openshift_infrastructure_id or ensure {{ install_dir }}/metadata.json exists with infraID
      (run --tags ignition, or openshift-install create ignition-configs --dir={{ install_dir }}).
  tags:
    - aws_nodes
    - ec2

- name: Build common EC2 tags for AWS cloud-controller-manager
  ansible.builtin.set_fact:
    # Keys in YAML mappings are not Jinja-templated; build the tag dict in one expression.
    aws_nodes_ec2_kubernetes_cluster_tags: "{{ {('kubernetes.io/cluster/' ~ (aws_nodes_openshift_infrastructure_id_resolved | string)): 'owned'} }}"
  tags:
    - aws_nodes
    - ec2

- name: Validate EC2 prerequisites
  ansible.builtin.assert:
    that:
      - aws_nodes_rhcos_ami_id_resolved is defined
      - aws_nodes_rhcos_ami_id_resolved | length > 0
      - ec2_key_name is defined
      - ec2_key_name | length > 0
    fail_msg: "Set rhcos_ami_id and ec2_key_name in group_vars. Get RHCOS AMI from OpenShift release metadata."
  tags:
    - aws_nodes
    - ec2

- name: Validate foundry subnets for EC2
  ansible.builtin.assert:
    that:
      - foundry_private_subnets is defined
      - foundry_private_subnets | length >= 3
    fail_msg: >-
      foundry_private_subnets is empty or has fewer than 3 subnets.
      Load foundry outputs: ansible-playbook playbooks/deploy_cluster.yml -e @foundry_output.json
      Or ensure foundry_output.json at {{ foundry_output_path | expanduser }} contains vault_private_subnet_ids (or ocp_upi_subnet_ids).
  tags:
    - aws_nodes
    - ec2

# Optional Foundry SGs (vault_api: API/MCS/bootstrap etcd; vault: broad intra-VPC TCP/UDP) align node ENIs with Terraform NLB/target rules.
- name: Compose ENI security groups for bootstrap and masters (cluster SGs + optional Foundry)
  ansible.builtin.set_fact:
    aws_nodes_bootstrap_network_groups: "{{ [aws_nodes_bootstrap_sg_id] + aws_nodes_foundry_extra_security_groups }}"
    aws_nodes_master_network_groups: "{{ [aws_nodes_master_sg_id] + aws_nodes_foundry_extra_security_groups }}"
  vars:
    _fv_api: "{{ foundry_vault_api_security_group_id | default('') | trim }}"
    _fv_vault: "{{ foundry_vault_security_group_id | default('') | trim }}"
    _fv_api_sg: "{{ (_fv_api | length > 0) | ternary([_fv_api], []) }}"
    _fv_vault_sg: "{{ (_fv_vault | length > 0) | ternary([_fv_vault], []) }}"
    aws_nodes_foundry_extra_security_groups: "{{ [] + _fv_api_sg + _fv_vault_sg }}"
  tags:
    - aws_nodes
    - ec2

- name: Launch bootstrap node
  vars:
    aws_nodes_instance_name_tag: "{{ cluster_name }}-bootstrap"
  amazon.aws.ec2_instance:
    name: "{{ cluster_name }}-bootstrap"
    image_id: "{{ aws_nodes_rhcos_ami_id_resolved }}"
    instance_type: "m6i.large"
    key_name: "{{ ec2_key_name }}"
    vpc_subnet_id: "{{ foundry_private_subnets[0] }}"
    network_interfaces:
      - subnet_id: "{{ foundry_private_subnets[0] }}"
        assign_public_ip: false
        groups: "{{ aws_nodes_bootstrap_network_groups }}"
    iam_instance_profile: "{{ aws_nodes_ignition_instance_profile }}"
    user_data: "{{ aws_nodes_bootstrap_user_data }}"
    volumes:
      - device_name: "{{ aws_nodes_rhcos_root_device_name_resolved }}"
        ebs:
          volume_size: "{{ aws_nodes_bootstrap_root_volume_size_gb | int }}"
          volume_type: gp3
          delete_on_termination: true
    tags: "{{ aws_nodes_ec2_kubernetes_cluster_tags | combine({'Name': aws_nodes_instance_name_tag, 'cluster': cluster_name, 'role': 'bootstrap'}) }}"
    state: present
  register: aws_nodes_bootstrap_instance
  tags:
    - aws_nodes
    - ec2

- name: Launch master nodes
  vars:
    aws_nodes_instance_name_tag: "{{ cluster_name }}-master-{{ item }}"
  amazon.aws.ec2_instance:
    name: "{{ cluster_name }}-master-{{ item }}"
    image_id: "{{ aws_nodes_rhcos_ami_id_resolved }}"
    instance_type: "{{ master_instance_type }}"
    key_name: "{{ ec2_key_name }}"
    vpc_subnet_id: "{{ foundry_private_subnets[item % foundry_private_subnets | length] }}"
    network_interfaces:
      - subnet_id: "{{ foundry_private_subnets[item % foundry_private_subnets | length] }}"
        assign_public_ip: false
        groups: "{{ aws_nodes_master_network_groups }}"
    iam_instance_profile: "{{ aws_nodes_ocp_master_instance_profile }}"
    user_data: "{{ aws_nodes_master_user_data }}"
    volumes:
      - device_name: "{{ aws_nodes_rhcos_root_device_name_resolved }}"
        ebs:
          volume_size: "{{ aws_nodes_master_root_volume_size_gb | int }}"
          volume_type: gp3
          delete_on_termination: true
    tags: "{{ aws_nodes_ec2_kubernetes_cluster_tags | combine({'Name': aws_nodes_instance_name_tag, 'cluster': cluster_name, 'role': 'master'}) }}"
    state: present
  loop: "{{ range(0, master_count) | list }}"
  register: aws_nodes_master_launch
  tags:
    - aws_nodes
    - ec2

- name: Launch worker nodes
  vars:
    aws_nodes_instance_name_tag: "{{ cluster_name }}-worker-{{ item }}"
  amazon.aws.ec2_instance:
    name: "{{ cluster_name }}-worker-{{ item }}"
    image_id: "{{ aws_nodes_rhcos_ami_id_resolved }}"
    instance_type: "{{ worker_instance_type }}"
    key_name: "{{ ec2_key_name }}"
    vpc_subnet_id: "{{ foundry_private_subnets[item % foundry_private_subnets | length] }}"
    network_interfaces:
      - subnet_id: "{{ foundry_private_subnets[item % foundry_private_subnets | length] }}"
        assign_public_ip: false
        groups:
          - "{{ aws_nodes_worker_sg_id }}"
    iam_instance_profile: "{{ aws_nodes_ocp_worker_instance_profile }}"
    user_data: "{{ aws_nodes_worker_user_data }}"
    volumes:
      - device_name: "{{ aws_nodes_rhcos_root_device_name_resolved }}"
        ebs:
          volume_size: "{{ aws_nodes_worker_root_volume_size_gb | int }}"
          volume_type: gp3
          delete_on_termination: true
    tags: "{{ aws_nodes_ec2_kubernetes_cluster_tags | combine({'Name': aws_nodes_instance_name_tag, 'cluster': cluster_name, 'role': 'worker'}) }}"
    state: present
  loop: "{{ range(0, worker_count) | list }}"
  register: aws_nodes_worker_launch
  tags:
    - aws_nodes
    - ec2

- name: Launch GPU worker nodes
  vars:
    aws_nodes_instance_name_tag: "{{ cluster_name }}-gpu-worker-{{ item }}"
  amazon.aws.ec2_instance:
    name: "{{ cluster_name }}-gpu-worker-{{ item }}"
    image_id: "{{ aws_nodes_rhcos_ami_id_resolved }}"
    instance_type: "{{ gpu_worker_instance_type }}"
    key_name: "{{ ec2_key_name }}"
    vpc_subnet_id: "{{ foundry_private_subnets[item % foundry_private_subnets | length] }}"
    network_interfaces:
      - subnet_id: "{{ foundry_private_subnets[item % foundry_private_subnets | length] }}"
        assign_public_ip: false
        groups:
          - "{{ aws_nodes_worker_sg_id }}"
    iam_instance_profile: "{{ aws_nodes_ocp_worker_instance_profile }}"
    user_data: "{{ aws_nodes_worker_user_data }}"
    volumes:
      - device_name: "{{ aws_nodes_rhcos_root_device_name_resolved }}"
        ebs:
          volume_size: "{{ aws_nodes_gpu_worker_root_volume_size_gb | int }}"
          volume_type: gp3
          delete_on_termination: true
    tags: "{{ aws_nodes_ec2_kubernetes_cluster_tags | combine({'Name': aws_nodes_instance_name_tag, 'cluster': cluster_name, 'role': 'gpu-worker'}) }}"
    state: present
  loop: "{{ range(0, gpu_worker_count | default(0)) | list }}"
  when: gpu_worker_count | default(0) | int > 0
  register: aws_nodes_gpu_worker_launch
  tags:
    - aws_nodes
    - ec2

- name: Optional — verify root EBS volume size on AMI root device (DescribeInstances / DescribeVolumes)
  when: aws_nodes_verify_root_ebs_size_after_launch | bool
  tags:
    - aws_nodes
    - ec2
  block:
    - name: Collect launched OCP instance IDs for root volume verification
      ansible.builtin.set_fact:
        aws_nodes_ec2_launched_instance_ids: >-
          {{
            (aws_nodes_bootstrap_instance.instance_ids | default([]))
            + (aws_nodes_master_launch.results | default([]) | map(attribute='instance_ids') | flatten)
            + (aws_nodes_worker_launch.results | default([]) | map(attribute='instance_ids') | flatten)
            + ((aws_nodes_gpu_worker_launch.results | default([]) | map(attribute='instance_ids') | flatten)
               if (gpu_worker_count | default(0) | int > 0) else [])
          }}

    - name: Assert launched instances exist for root volume verification
      ansible.builtin.assert:
        that:
          - aws_nodes_ec2_launched_instance_ids | length > 0
        fail_msg: No EC2 instance IDs collected for root volume verification (unexpected after launch tasks).

    - name: Describe launched instances (block device mappings)
      amazon.aws.ec2_instance_info:
        region: "{{ foundry_region }}"
        instance_ids: "{{ aws_nodes_ec2_launched_instance_ids }}"
      register: aws_nodes_verify_ec2_info

    - name: Build expected root volume size (GiB) by instance role tag
      ansible.builtin.set_fact:
        aws_nodes_expected_root_gib_by_role:
          bootstrap: "{{ aws_nodes_bootstrap_root_volume_size_gb | int }}"
          master: "{{ aws_nodes_master_root_volume_size_gb | int }}"
          worker: "{{ aws_nodes_worker_root_volume_size_gb | int }}"
          gpu-worker: "{{ aws_nodes_gpu_worker_root_volume_size_gb | int }}"

    - name: Reset root volume verification entry list (idempotent block)
      ansible.builtin.set_fact:
        aws_nodes_root_vol_verify_entries: []

    - name: Build root volume verification entries (device must match resolved AMI root)
      ansible.builtin.set_fact:
        aws_nodes_root_vol_verify_entries: "{{ aws_nodes_root_vol_verify_entries + [verify_entry] }}"
      loop: "{{ aws_nodes_verify_ec2_info.instances }}"
      vars:
        root_bdm: >-
          {{
            item.block_device_mappings
            | selectattr('device_name', 'equalto', aws_nodes_rhcos_root_device_name_resolved)
            | list | first | default({}, true)
          }}
        inst_role: "{{ item.tags.role | default('worker') }}"
        verify_entry:
          instance_id: "{{ item.instance_id }}"
          role: "{{ inst_role }}"
          volume_id: "{{ (root_bdm.ebs | default({})).volume_id | default('', true) }}"
          expected_gib: "{{ aws_nodes_expected_root_gib_by_role[inst_role] | default(aws_nodes_worker_root_volume_size_gb | int) | int }}"

    - name: Assert root block device mapping exists at resolved device name
      ansible.builtin.assert:
        that:
          - item.volume_id | length > 0
        fail_msg: >-
          Instance {{ item.instance_id }} (role {{ item.role }}) has no EBS mapping for
          {{ aws_nodes_rhcos_root_device_name_resolved }}. Override aws_nodes_rhcos_root_device_name only to match describe-images RootDeviceName.
      loop: "{{ aws_nodes_root_vol_verify_entries }}"

    - name: Describe root EBS volumes by volume ID
      amazon.aws.ec2_vol_info:
        region: "{{ foundry_region }}"
        filters:
          volume-id: "{{ item.volume_id }}"
      loop: "{{ aws_nodes_root_vol_verify_entries }}"
      register: aws_nodes_root_vol_describe

    - name: Assert root EBS size meets configured minimum for role
      ansible.builtin.assert:
        that:
          - volwrap.volumes | length > 0
          - volwrap.volumes[0].size | int >= volwrap.item.expected_gib | int
        fail_msg: >-
          Instance {{ volwrap.item.instance_id }} (role {{ volwrap.item.role }}) root volume {{ volwrap.item.volume_id }}
          is {{ (volwrap.volumes[0].size | default(0)) }} GiB; expected >= {{ volwrap.item.expected_gib }} GiB
          on {{ aws_nodes_rhcos_root_device_name_resolved }}.
      loop: "{{ aws_nodes_root_vol_describe.results }}"
      loop_control:
        loop_var: volwrap
