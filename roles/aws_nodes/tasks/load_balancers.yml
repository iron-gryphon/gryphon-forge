---
# Internal NLBs for OpenShift API (6443), MCS (22623)
# Ingress: ALB (HTTPS) when foundry provides ACM cert; else NLB (TCP passthrough)

- name: Create NLB target group for API (6443)
  community.aws.elb_target_group:
    name: "{{ cluster_name }}-api-tg"
    protocol: TCP
    port: 6443
    vpc_id: "{{ foundry_vpc_id }}"
    target_type: instance
    state: present
    # AWS defaults (e.g. healthy_threshold 5 × 30s) delay "healthy" long after apiserver listens; tighten for bootstrap API.
    health_check_protocol: tcp
    health_check_port: traffic-port
    health_check_interval: 15
    health_check_timeout: 10
    healthy_threshold_count: 2
    unhealthy_threshold_count: 2
    region: "{{ foundry_region }}"
  register: aws_nodes_api_tg
  tags:
    - aws_nodes
    - load_balancers

- name: Create NLB for API
  community.aws.elb_network_lb:
    name: "{{ cluster_name }}-api"
    subnets: "{{ foundry_private_subnets }}"
    scheme: internal
    # Required for multi-AZ: bootstrap is in one AZ; without cross-zone, clients that hit an NLB
    # node in another AZ see no healthy targets until masters serve 6443 → install timeouts.
    cross_zone_load_balancing: true
    listeners:
      - Protocol: TCP
        Port: 6443
        DefaultActions:
          - Type: forward
            TargetGroupArn: "{{ aws_nodes_api_tg.target_group_arn }}"
    state: present
    region: "{{ foundry_region }}"
  register: aws_nodes_api_nlb
  tags:
    - aws_nodes
    - load_balancers

- name: Create NLB target group for MCS (22623)
  community.aws.elb_target_group:
    name: "{{ cluster_name }}-mcs-tg"
    protocol: TCP
    port: 22623
    vpc_id: "{{ foundry_vpc_id }}"
    target_type: instance
    state: present
    region: "{{ foundry_region }}"
  register: aws_nodes_mcs_tg
  tags:
    - aws_nodes
    - load_balancers

- name: Create NLB for Machine Config Server
  community.aws.elb_network_lb:
    name: "{{ cluster_name }}-mcs"
    subnets: "{{ foundry_private_subnets }}"
    scheme: internal
    cross_zone_load_balancing: true
    listeners:
      - Protocol: TCP
        Port: 22623
        DefaultActions:
          - Type: forward
            TargetGroupArn: "{{ aws_nodes_mcs_tg.target_group_arn }}"
    state: present
    region: "{{ foundry_region }}"
  tags:
    - aws_nodes
    - load_balancers

# --- Ingress: ALB (when ACM cert from foundry) or NLB (TCP passthrough) ---
- name: Create ALB target group for Ingress (HTTP 80)
  community.aws.elb_target_group:
    name: "{{ cluster_name }}-ingress-80-tg"
    protocol: HTTP
    port: 80
    vpc_id: "{{ foundry_vpc_id }}"
    target_type: instance
    state: present
    region: "{{ foundry_region }}"
  register: aws_nodes_ingress_80_tg
  when: foundry_ingress_certificate_arn | default('') | length > 0
  tags:
    - aws_nodes
    - load_balancers

- name: Create internal ALB for Ingress
  amazon.aws.elb_application_lb:
    name: "{{ cluster_name }}-ingress"
    subnets: "{{ foundry_private_subnets }}"
    security_groups:
      - "{{ aws_nodes_ingress_alb_sg_id }}"
    scheme: internal
    listeners:
      - Protocol: HTTPS
        Port: 443
        SslPolicy: "ELBSecurityPolicy-TLS13-1-2-2021-06"
        Certificates:
          - CertificateArn: "{{ foundry_ingress_certificate_arn }}"
        DefaultActions:
          - Type: forward
            TargetGroupArn: "{{ aws_nodes_ingress_80_tg.target_group_arn }}"
      - Protocol: HTTP
        Port: 80
        DefaultActions:
          - Type: forward
            TargetGroupArn: "{{ aws_nodes_ingress_80_tg.target_group_arn }}"
    state: present
    region: "{{ foundry_region }}"
  when: foundry_ingress_certificate_arn | default('') | length > 0
  tags:
    - aws_nodes
    - load_balancers

- name: Create NLB target group for Ingress (443)
  community.aws.elb_target_group:
    name: "{{ cluster_name }}-ingress-443-tg"
    protocol: TCP
    port: 443
    vpc_id: "{{ foundry_vpc_id }}"
    target_type: instance
    state: present
    region: "{{ foundry_region }}"
  register: aws_nodes_ingress_443_tg
  when: foundry_ingress_certificate_arn | default('') | length == 0
  tags:
    - aws_nodes
    - load_balancers

- name: Create NLB target group for Ingress (80)
  community.aws.elb_target_group:
    name: "{{ cluster_name }}-ingress-80-tg"
    protocol: TCP
    port: 80
    vpc_id: "{{ foundry_vpc_id }}"
    target_type: instance
    state: present
    region: "{{ foundry_region }}"
  register: aws_nodes_ingress_80_tg
  when: foundry_ingress_certificate_arn | default('') | length == 0
  tags:
    - aws_nodes
    - load_balancers

- name: Create internal NLB for Ingress
  community.aws.elb_network_lb:
    name: "{{ cluster_name }}-ingress"
    subnets: "{{ foundry_private_subnets }}"
    scheme: internal
    cross_zone_load_balancing: true
    listeners:
      - Protocol: TCP
        Port: 443
        DefaultActions:
          - Type: forward
            TargetGroupArn: "{{ aws_nodes_ingress_443_tg.target_group_arn }}"
      - Protocol: TCP
        Port: 80
        DefaultActions:
          - Type: forward
            TargetGroupArn: "{{ aws_nodes_ingress_80_tg.target_group_arn }}"
    state: present
    region: "{{ foundry_region }}"
  register: aws_nodes_ingress_nlb
  when: foundry_ingress_certificate_arn | default('') | length == 0
  tags:
    - aws_nodes
    - load_balancers

# Prefer IDs from ec2_instance module results (no tag-filter lag). Fallback: describe with retries
# (AWS can take time before tag filters return newly launched instances; empty TG → api-int:6443 hangs).
- name: Build API target instance IDs from EC2 launch results (this play)
  ansible.builtin.set_fact:
    aws_nodes_lb_api_target_ids: >-
      {{
        (
          (aws_nodes_bootstrap_instance.instance_ids | default([]))
          + ((aws_nodes_master_launch | default({})).results | default([])
             | map(attribute='instance_ids') | flatten | list)
        ) | unique | list
      }}
  when:
    - aws_nodes_bootstrap_instance is defined
    - not (aws_nodes_bootstrap_instance.skipped | default(false))
    - (aws_nodes_bootstrap_instance.instance_ids | default([]) | length) > 0
  tags:
    - aws_nodes
    - load_balancers

- name: Discover bootstrap and master IDs for ELB (when EC2 tasks were skipped, e.g. --tags load_balancers)
  when: (aws_nodes_lb_api_target_ids | default([]) | length) == 0
  block:
    - name: Wait for bootstrap visible to EC2 API (tag filter after launch)
      amazon.aws.ec2_instance_info:
        filters:
          "tag:cluster": "{{ cluster_name }}"
          "tag:role": "bootstrap"
          "instance-state-name": "running"
        region: "{{ foundry_region }}"
      register: aws_nodes_lb_bootstrap_query
      until: (aws_nodes_lb_bootstrap_query.instances | default([]) | length) > 0
      retries: "{{ aws_nodes_lb_target_discovery_retries | int }}"
      delay: "{{ aws_nodes_lb_target_discovery_delay | int }}"
      tags:
        - aws_nodes
        - load_balancers

    - name: Wait for masters visible to EC2 API
      amazon.aws.ec2_instance_info:
        filters:
          "tag:cluster": "{{ cluster_name }}"
          "tag:role": "master"
          "instance-state-name": "running"
        region: "{{ foundry_region }}"
      register: aws_nodes_lb_master_query
      until: (aws_nodes_lb_master_query.instances | default([]) | length) >= (master_count | int)
      retries: "{{ aws_nodes_lb_target_discovery_retries | int }}"
      delay: "{{ aws_nodes_lb_target_discovery_delay | int }}"
      tags:
        - aws_nodes
        - load_balancers

    - name: Set API target IDs from EC2 describe
      ansible.builtin.set_fact:
        aws_nodes_lb_api_target_ids: >-
          {{
            (
              (aws_nodes_lb_bootstrap_query.instances | default([]) | map(attribute='instance_id') | list)
              + (aws_nodes_lb_master_query.instances | default([]) | map(attribute='instance_id') | list)
            ) | unique | list
          }}
      tags:
        - aws_nodes
        - load_balancers

- name: Require instances for API/MCS target registration
  ansible.builtin.assert:
    that:
      - aws_nodes_lb_api_target_ids | length > 0
    fail_msg: >-
      No running bootstrap/masters to attach to {{ cluster_name }}-api-tg. If nodes exist, re-run with
      --tags 'ec2,load_balancers' or check tag:cluster={{ cluster_name }}, role bootstrap/master, region {{ foundry_region }}.
  tags:
    - aws_nodes
    - load_balancers

- name: Register bootstrap and masters to API target group
  community.aws.elb_target:
    target_group_arn: "{{ aws_nodes_api_tg.target_group_arn }}"
    target_id: "{{ item }}"
    target_port: 6443
    state: present
    region: "{{ foundry_region }}"
  loop: "{{ aws_nodes_lb_api_target_ids }}"
  tags:
    - aws_nodes
    - load_balancers

- name: Register bootstrap to MCS target group
  community.aws.elb_target:
    target_group_arn: "{{ aws_nodes_mcs_tg.target_group_arn }}"
    target_id: "{{ aws_nodes_lb_api_target_ids[0] }}"
    target_port: 22623
    state: present
    region: "{{ foundry_region }}"
  tags:
    - aws_nodes
    - load_balancers
