---
# Internal NLBs for OpenShift API (6443), MCS (22623)
# Ingress: ALB (HTTPS) when foundry provides ACM cert; else NLB (TCP passthrough)

- name: Create NLB target group for API (6443)
  community.aws.elb_target_group:
    name: "{{ cluster_name }}-api-tg"
    protocol: TCP
    port: 6443
    vpc_id: "{{ foundry_vpc_id }}"
    target_type: instance
    state: present
  register: aws_nodes_api_tg
  tags:
    - aws_nodes
    - load_balancers

- name: Create NLB for API
  community.aws.elb_network_lb:
    name: "{{ cluster_name }}-api"
    subnets: "{{ foundry_private_subnets }}"
    scheme: internal
    # Required for multi-AZ: bootstrap is in one AZ; without cross-zone, clients that hit an NLB
    # node in another AZ see no healthy targets until masters serve 6443 → install timeouts.
    cross_zone_load_balancing: true
    listeners:
      - Protocol: TCP
        Port: 6443
        DefaultActions:
          - Type: forward
            TargetGroupArn: "{{ aws_nodes_api_tg.target_group_arn }}"
    state: present
  register: aws_nodes_api_nlb
  tags:
    - aws_nodes
    - load_balancers

- name: Create NLB target group for MCS (22623)
  community.aws.elb_target_group:
    name: "{{ cluster_name }}-mcs-tg"
    protocol: TCP
    port: 22623
    vpc_id: "{{ foundry_vpc_id }}"
    target_type: instance
    state: present
  register: aws_nodes_mcs_tg
  tags:
    - aws_nodes
    - load_balancers

- name: Create NLB for Machine Config Server
  community.aws.elb_network_lb:
    name: "{{ cluster_name }}-mcs"
    subnets: "{{ foundry_private_subnets }}"
    scheme: internal
    cross_zone_load_balancing: true
    listeners:
      - Protocol: TCP
        Port: 22623
        DefaultActions:
          - Type: forward
            TargetGroupArn: "{{ aws_nodes_mcs_tg.target_group_arn }}"
    state: present
  tags:
    - aws_nodes
    - load_balancers

# --- Ingress: ALB (when ACM cert from foundry) or NLB (TCP passthrough) ---
- name: Create ALB target group for Ingress (HTTP 80)
  community.aws.elb_target_group:
    name: "{{ cluster_name }}-ingress-80-tg"
    protocol: HTTP
    port: 80
    vpc_id: "{{ foundry_vpc_id }}"
    target_type: instance
    state: present
  register: aws_nodes_ingress_80_tg
  when: foundry_ingress_certificate_arn | default('') | length > 0
  tags:
    - aws_nodes
    - load_balancers

- name: Create internal ALB for Ingress
  amazon.aws.elb_application_lb:
    name: "{{ cluster_name }}-ingress"
    subnets: "{{ foundry_private_subnets }}"
    security_groups:
      - "{{ aws_nodes_ingress_alb_sg_id }}"
    scheme: internal
    listeners:
      - Protocol: HTTPS
        Port: 443
        SslPolicy: "ELBSecurityPolicy-TLS13-1-2-2021-06"
        Certificates:
          - CertificateArn: "{{ foundry_ingress_certificate_arn }}"
        DefaultActions:
          - Type: forward
            TargetGroupArn: "{{ aws_nodes_ingress_80_tg.target_group_arn }}"
      - Protocol: HTTP
        Port: 80
        DefaultActions:
          - Type: forward
            TargetGroupArn: "{{ aws_nodes_ingress_80_tg.target_group_arn }}"
    state: present
  when: foundry_ingress_certificate_arn | default('') | length > 0
  tags:
    - aws_nodes
    - load_balancers

- name: Create NLB target group for Ingress (443)
  community.aws.elb_target_group:
    name: "{{ cluster_name }}-ingress-443-tg"
    protocol: TCP
    port: 443
    vpc_id: "{{ foundry_vpc_id }}"
    target_type: instance
    state: present
  register: aws_nodes_ingress_443_tg
  when: foundry_ingress_certificate_arn | default('') | length == 0
  tags:
    - aws_nodes
    - load_balancers

- name: Create NLB target group for Ingress (80)
  community.aws.elb_target_group:
    name: "{{ cluster_name }}-ingress-80-tg"
    protocol: TCP
    port: 80
    vpc_id: "{{ foundry_vpc_id }}"
    target_type: instance
    state: present
  register: aws_nodes_ingress_80_tg
  when: foundry_ingress_certificate_arn | default('') | length == 0
  tags:
    - aws_nodes
    - load_balancers

- name: Create internal NLB for Ingress
  community.aws.elb_network_lb:
    name: "{{ cluster_name }}-ingress"
    subnets: "{{ foundry_private_subnets }}"
    scheme: internal
    cross_zone_load_balancing: true
    listeners:
      - Protocol: TCP
        Port: 443
        DefaultActions:
          - Type: forward
            TargetGroupArn: "{{ aws_nodes_ingress_443_tg.target_group_arn }}"
      - Protocol: TCP
        Port: 80
        DefaultActions:
          - Type: forward
            TargetGroupArn: "{{ aws_nodes_ingress_80_tg.target_group_arn }}"
    state: present
  register: aws_nodes_ingress_nlb
  when: foundry_ingress_certificate_arn | default('') | length == 0
  tags:
    - aws_nodes
    - load_balancers

- name: Get bootstrap and master instance IDs for target registration
  amazon.aws.ec2_instance_info:
    filters:
      "tag:cluster": "{{ cluster_name }}"
      "tag:role": "{{ item }}"
      "instance-state-name": "running"
    region: "{{ foundry_region }}"
  register: aws_nodes_lb_target_instances
  loop:
    - bootstrap
    - master
  tags:
    - aws_nodes
    - load_balancers

- name: Register bootstrap and masters to API target group
  community.aws.elb_target:
    target_group_arn: "{{ aws_nodes_api_tg.target_group_arn }}"
    target_id: "{{ item }}"
    target_port: 6443
    state: present
  loop: "{{ aws_nodes_lb_target_instances.results | map(attribute='instances') | flatten | map(attribute='instance_id') | list | unique }}"
  when: (aws_nodes_lb_target_instances.results | map(attribute='instances') | flatten | length) > 0
  tags:
    - aws_nodes
    - load_balancers

- name: Register bootstrap to MCS target group
  community.aws.elb_target:
    target_group_arn: "{{ aws_nodes_mcs_tg.target_group_arn }}"
    target_id: "{{ aws_nodes_lb_target_instances.results[0].instances[0].instance_id }}"
    target_port: 22623
    state: present
  when:
    - aws_nodes_lb_target_instances.results[0].instances | default([]) | length > 0
  tags:
    - aws_nodes
    - load_balancers
