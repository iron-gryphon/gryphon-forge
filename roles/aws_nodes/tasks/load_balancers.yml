---
# Internal NLBs for OpenShift API (6443), MCS (22623)
# Ingress: ALB (HTTPS) when foundry provides ACM cert; else NLB (TCP passthrough)
#
# community.aws.elb_target_group defaults modify_targets=true; with no `targets` key it deregisters
# every attachment. We register instances via community.aws.elb_target — set modify_targets: false.

- name: Create NLB target group for API (6443)
  community.aws.elb_target_group:
    name: "{{ cluster_name }}-api-tg"
    protocol: TCP
    port: 6443
    vpc_id: "{{ foundry_vpc_id }}"
    target_type: instance
    modify_targets: false
    state: present
    # AWS defaults (e.g. healthy_threshold 5 × 30s) delay "healthy" long after apiserver listens; tighten for bootstrap API.
    health_check_protocol: tcp
    health_check_port: traffic-port
    health_check_interval: 15
    health_check_timeout: 10
    healthy_threshold_count: 2
    unhealthy_threshold_count: 2
    region: "{{ foundry_region }}"
  register: aws_nodes_api_tg
  tags:
    - aws_nodes
    - load_balancers

- name: Create NLB for API
  community.aws.elb_network_lb:
    name: "{{ cluster_name }}-api"
    subnets: "{{ foundry_private_subnets }}"
    scheme: internal
    # Required for multi-AZ: bootstrap is in one AZ; without cross-zone, clients that hit an NLB
    # node in another AZ see no healthy targets until masters serve 6443 → install timeouts.
    cross_zone_load_balancing: true
    listeners:
      - Protocol: TCP
        Port: 6443
        DefaultActions:
          - Type: forward
            TargetGroupArn: "{{ aws_nodes_api_tg.target_group_arn }}"
    state: present
    region: "{{ foundry_region }}"
  register: aws_nodes_api_nlb
  tags:
    - aws_nodes
    - load_balancers

- name: Create NLB target group for MCS (22623)
  community.aws.elb_target_group:
    name: "{{ cluster_name }}-mcs-tg"
    protocol: TCP
    port: 22623
    vpc_id: "{{ foundry_vpc_id }}"
    target_type: instance
    modify_targets: false
    state: present
    region: "{{ foundry_region }}"
  register: aws_nodes_mcs_tg
  tags:
    - aws_nodes
    - load_balancers

- name: Create NLB for Machine Config Server
  community.aws.elb_network_lb:
    name: "{{ cluster_name }}-mcs"
    subnets: "{{ foundry_private_subnets }}"
    scheme: internal
    cross_zone_load_balancing: true
    listeners:
      - Protocol: TCP
        Port: 22623
        DefaultActions:
          - Type: forward
            TargetGroupArn: "{{ aws_nodes_mcs_tg.target_group_arn }}"
    state: present
    region: "{{ foundry_region }}"
  tags:
    - aws_nodes
    - load_balancers

# --- Ingress: ALB (when ACM cert from foundry) or NLB (TCP passthrough) ---
- name: Create ALB target group for Ingress (HTTP 80)
  community.aws.elb_target_group:
    name: "{{ cluster_name }}-ingress-80-tg"
    protocol: HTTP
    port: 80
    vpc_id: "{{ foundry_vpc_id }}"
    target_type: instance
    modify_targets: false
    state: present
    region: "{{ foundry_region }}"
  register: aws_nodes_ingress_80_tg
  when: foundry_ingress_certificate_arn | default('') | length > 0
  tags:
    - aws_nodes
    - load_balancers

- name: Create internal ALB for Ingress
  amazon.aws.elb_application_lb:
    name: "{{ cluster_name }}-ingress"
    subnets: "{{ foundry_private_subnets }}"
    security_groups:
      - "{{ aws_nodes_ingress_alb_sg_id }}"
    scheme: internal
    listeners:
      - Protocol: HTTPS
        Port: 443
        SslPolicy: "ELBSecurityPolicy-TLS13-1-2-2021-06"
        Certificates:
          - CertificateArn: "{{ foundry_ingress_certificate_arn }}"
        DefaultActions:
          - Type: forward
            TargetGroupArn: "{{ aws_nodes_ingress_80_tg.target_group_arn }}"
      - Protocol: HTTP
        Port: 80
        DefaultActions:
          - Type: forward
            TargetGroupArn: "{{ aws_nodes_ingress_80_tg.target_group_arn }}"
    state: present
    region: "{{ foundry_region }}"
  when: foundry_ingress_certificate_arn | default('') | length > 0
  tags:
    - aws_nodes
    - load_balancers

- name: Create NLB target group for Ingress (443)
  community.aws.elb_target_group:
    name: "{{ cluster_name }}-ingress-443-tg"
    protocol: TCP
    port: 443
    vpc_id: "{{ foundry_vpc_id }}"
    target_type: instance
    modify_targets: false
    state: present
    region: "{{ foundry_region }}"
  register: aws_nodes_ingress_443_tg
  when: foundry_ingress_certificate_arn | default('') | length == 0
  tags:
    - aws_nodes
    - load_balancers

- name: Create NLB target group for Ingress (80)
  community.aws.elb_target_group:
    name: "{{ cluster_name }}-ingress-80-tg"
    protocol: TCP
    port: 80
    vpc_id: "{{ foundry_vpc_id }}"
    target_type: instance
    modify_targets: false
    state: present
    region: "{{ foundry_region }}"
  register: aws_nodes_ingress_80_tg
  when: foundry_ingress_certificate_arn | default('') | length == 0
  tags:
    - aws_nodes
    - load_balancers

- name: Create internal NLB for Ingress
  community.aws.elb_network_lb:
    name: "{{ cluster_name }}-ingress"
    subnets: "{{ foundry_private_subnets }}"
    scheme: internal
    cross_zone_load_balancing: true
    listeners:
      - Protocol: TCP
        Port: 443
        DefaultActions:
          - Type: forward
            TargetGroupArn: "{{ aws_nodes_ingress_443_tg.target_group_arn }}"
      - Protocol: TCP
        Port: 80
        DefaultActions:
          - Type: forward
            TargetGroupArn: "{{ aws_nodes_ingress_80_tg.target_group_arn }}"
    state: present
    region: "{{ foundry_region }}"
  register: aws_nodes_ingress_nlb
  when: foundry_ingress_certificate_arn | default('') | length == 0
  tags:
    - aws_nodes
    - load_balancers

# Prefer IDs from ec2_instance module results (no tag-filter lag). Fallback: instance_id from
# registered `instances` when `instance_ids` is empty (some collection paths). Else: describe with retries
# (pending|running so a quick re-run still registers targets before kubelet listens).
- name: Build API target instance IDs from EC2 launch results (this play)
  ansible.builtin.set_fact:
    aws_nodes_lb_api_target_ids: "{{ _api_from_ec2 | unique | list }}"
  vars:
    _bootstrap_ids: "{{ aws_nodes_bootstrap_instance.instance_ids | default([]) }}"
    _bootstrap_from_inst: "{{ aws_nodes_bootstrap_instance.instances | default([]) | map(attribute='instance_id') | list }}"
    _master_flat: "{{ aws_nodes_master_launch.results | default([]) | map(attribute='instance_ids') | flatten | list }}"
    _master_from_inst: >-
      {{
        aws_nodes_master_launch.results | default([])
        | map(attribute='instances')
        | flatten
        | map(attribute='instance_id')
        | list
      }}
    _api_from_ec2: >-
      {{
        ((_bootstrap_ids | length > 0) | ternary(_bootstrap_ids, _bootstrap_from_inst))
        + ((_master_flat | length > 0) | ternary(_master_flat, _master_from_inst))
      }}
  when:
    - aws_nodes_bootstrap_instance is defined
    - not (aws_nodes_bootstrap_instance.skipped | default(false))
    - >-
      (
        (aws_nodes_bootstrap_instance.instance_ids | default([]) | length) > 0
        or (aws_nodes_bootstrap_instance.instances | default([]) | length) > 0
      )
  tags:
    - aws_nodes
    - load_balancers

- name: Discover bootstrap and master IDs for ELB (when EC2 tasks were skipped, e.g. --tags load_balancers)
  when: (aws_nodes_lb_api_target_ids | default([]) | length) == 0
  block:
    - name: Wait for bootstrap visible to EC2 API (tag filter after launch)
      amazon.aws.ec2_instance_info:
        filters:
          "tag:cluster": "{{ cluster_name }}"
          "tag:role": "bootstrap"
          "instance-state-name":
            - pending
            - running
        region: "{{ foundry_region }}"
      register: aws_nodes_lb_bootstrap_query
      until: (aws_nodes_lb_bootstrap_query.instances | default([]) | length) > 0
      retries: "{{ aws_nodes_lb_target_discovery_retries | int }}"
      delay: "{{ aws_nodes_lb_target_discovery_delay | int }}"
      tags:
        - aws_nodes
        - load_balancers

    - name: Wait for masters visible to EC2 API
      amazon.aws.ec2_instance_info:
        filters:
          "tag:cluster": "{{ cluster_name }}"
          "tag:role": "master"
          "instance-state-name":
            - pending
            - running
        region: "{{ foundry_region }}"
      register: aws_nodes_lb_master_query
      until: (aws_nodes_lb_master_query.instances | default([]) | length) >= (master_count | int)
      retries: "{{ aws_nodes_lb_target_discovery_retries | int }}"
      delay: "{{ aws_nodes_lb_target_discovery_delay | int }}"
      tags:
        - aws_nodes
        - load_balancers

    - name: Set API target IDs from EC2 describe
      ansible.builtin.set_fact:
        aws_nodes_lb_api_target_ids: >-
          {{
            (
              (aws_nodes_lb_bootstrap_query.instances | default([]) | map(attribute='instance_id') | list)
              + (aws_nodes_lb_master_query.instances | default([]) | map(attribute='instance_id') | list)
            ) | unique | list
          }}
      tags:
        - aws_nodes
        - load_balancers

- name: Require instances for API/MCS target registration
  ansible.builtin.assert:
    that:
      - aws_nodes_lb_api_target_ids | length > 0
    fail_msg: >-
      No bootstrap/masters to attach to {{ cluster_name }}-api-tg. If nodes exist, re-run with
      --tags 'ec2,load_balancers' or check tag:cluster={{ cluster_name }}, role bootstrap/master, region {{ foundry_region }}.
  tags:
    - aws_nodes
    - load_balancers

- name: Set bootstrap instance ID from EC2 register (MCS target group)
  ansible.builtin.set_fact:
    aws_nodes_lb_bootstrap_id: "{{ aws_nodes_bootstrap_instance.instance_ids[0] }}"
  when:
    - aws_nodes_bootstrap_instance is defined
    - not (aws_nodes_bootstrap_instance.skipped | default(false))
    - (aws_nodes_bootstrap_instance.instance_ids | default([]) | length) > 0
  tags:
    - aws_nodes
    - load_balancers

- name: Set bootstrap instance ID from EC2 instances list when instance_ids empty
  ansible.builtin.set_fact:
    aws_nodes_lb_bootstrap_id: "{{ aws_nodes_bootstrap_instance.instances[0].instance_id }}"
  when:
    - aws_nodes_lb_bootstrap_id is not defined
    - aws_nodes_bootstrap_instance is defined
    - not (aws_nodes_bootstrap_instance.skipped | default(false))
    - (aws_nodes_bootstrap_instance.instances | default([]) | length) > 0
  tags:
    - aws_nodes
    - load_balancers

- name: Set bootstrap instance ID from discovery query
  ansible.builtin.set_fact:
    aws_nodes_lb_bootstrap_id: "{{ aws_nodes_lb_bootstrap_query.instances[0].instance_id }}"
  when:
    - aws_nodes_lb_bootstrap_id is not defined
    - aws_nodes_lb_bootstrap_query is defined
    - (aws_nodes_lb_bootstrap_query.instances | default([]) | length) > 0
  tags:
    - aws_nodes
    - load_balancers

- name: Require bootstrap instance ID for MCS target group
  ansible.builtin.assert:
    that:
      - aws_nodes_lb_bootstrap_id is defined
      - aws_nodes_lb_bootstrap_id | length > 0
    fail_msg: >-
      Could not resolve bootstrap instance ID for {{ cluster_name }}-mcs-tg (needed for :22623).
  tags:
    - aws_nodes
    - load_balancers

- name: Describe API target group for idempotent registration
  community.aws.elb_target_group_info:
    names:
      - "{{ cluster_name }}-api-tg"
    collect_targets_health: true
    region: "{{ foundry_region }}"
  register: aws_nodes_lb_api_tg_existing
  tags:
    - aws_nodes
    - load_balancers

- name: Set fact for instance IDs already registered on API target group
  ansible.builtin.set_fact:
    aws_nodes_lb_api_already_registered: >-
      {{
        (
          (aws_nodes_lb_api_tg_existing.target_groups | default([{}]))[0].targets_health_description | default([])
        )
        | map(attribute='target')
        | map(attribute='id')
        | list
      }}
  when: aws_nodes_lb_api_tg_existing.target_groups | default([]) | length > 0
  tags:
    - aws_nodes
    - load_balancers

- name: Default empty when API target group has no registrations
  ansible.builtin.set_fact:
    aws_nodes_lb_api_already_registered: []
  when: aws_nodes_lb_api_already_registered is not defined
  tags:
    - aws_nodes
    - load_balancers

- name: Register missing bootstrap and master instances on API target group
  community.aws.elb_target:
    target_group_arn: "{{ aws_nodes_api_tg.target_group_arn }}"
    target_id: "{{ item }}"
    target_port: 6443
    state: present
    region: "{{ foundry_region }}"
  loop: "{{ aws_nodes_lb_api_target_ids | difference(aws_nodes_lb_api_already_registered | default([])) }}"
  tags:
    - aws_nodes
    - load_balancers

- name: Describe MCS target group for idempotent registration
  community.aws.elb_target_group_info:
    names:
      - "{{ cluster_name }}-mcs-tg"
    collect_targets_health: true
    region: "{{ foundry_region }}"
  register: aws_nodes_lb_mcs_tg_existing
  tags:
    - aws_nodes
    - load_balancers

- name: Set fact for instance IDs already on MCS target group
  ansible.builtin.set_fact:
    aws_nodes_lb_mcs_already_registered: >-
      {{
        (
          (aws_nodes_lb_mcs_tg_existing.target_groups | default([{}]))[0].targets_health_description | default([])
        )
        | map(attribute='target')
        | map(attribute='id')
        | list
      }}
  when: aws_nodes_lb_mcs_tg_existing.target_groups | default([]) | length > 0
  tags:
    - aws_nodes
    - load_balancers

- name: Default empty when MCS target group has no registrations
  ansible.builtin.set_fact:
    aws_nodes_lb_mcs_already_registered: []
  when: aws_nodes_lb_mcs_already_registered is not defined
  tags:
    - aws_nodes
    - load_balancers

- name: Register bootstrap to MCS target group when missing
  community.aws.elb_target:
    target_group_arn: "{{ aws_nodes_mcs_tg.target_group_arn }}"
    target_id: "{{ aws_nodes_lb_bootstrap_id }}"
    target_port: 22623
    state: present
    region: "{{ foundry_region }}"
  when: aws_nodes_lb_bootstrap_id not in aws_nodes_lb_mcs_already_registered
  tags:
    - aws_nodes
    - load_balancers

# NLB/TG validation runs from main.yml after route53.yml so api-int exists before bastion DNS probes.
