---
# Gryphon Forge - Deploy OpenShift UPI cluster
# Transitions from "Empty VPC" to "Functional Cluster"

- name: Load foundry outputs
  hosts: local
  gather_facts: true
  tasks:
    - name: Check if foundry output exists
      ansible.builtin.stat:
        path: "{{ foundry_output_path | expand_user }}"
      register: foundry_output_stat
      tags:
        - always

    - name: Load foundry_output.json if present
      ansible.builtin.include_vars:
        file: "{{ foundry_output_path | expand_user }}"
        name: foundry
      when: foundry_output_stat.stat.exists | default(false)
      tags:
        - always

    - name: Override with foundry outputs
      ansible.builtin.set_fact:
        foundry_vpc_id: "{{ foundry.vault_vpc_id | default(foundry_vpc_id) }}"
        foundry_private_subnets: "{{ foundry.private_subnet_ids | default(foundry_private_subnets) }}"
        foundry_bastion_security_group_id: "{{ foundry.bastion_security_group_id | default(foundry_bastion_security_group_id) }}"
        foundry_internal_hosted_zone_id: "{{ foundry.internal_hosted_zone_id | default(foundry_internal_hosted_zone_id) }}"
        foundry_region: "{{ foundry.region | default(foundry_region) }}"
      when: foundry is defined
      tags:
        - always

- name: Configuration - Define node counts and instance sizing
  hosts: local
  gather_facts: true
  tags:
    - config
    - ignition
  tasks:
    - name: Validate configuration
      ansible.builtin.assert:
        that:
          - foundry_vpc_id | length > 0
          - foundry_private_subnets | length >= 3
          - cluster_name | length > 0
          - base_domain | length > 0
        fail_msg: "Missing required config. Set foundry_vpc_id, foundry_private_subnets (min 3), cluster_name, base_domain."
      tags:
        - config
        - ignition

- name: Ignition Generation - Fetch pull secrets and generate ignition files
  hosts: local
  gather_facts: true
  roles:
    - role: ignition
      tags:
        - ignition

- name: Provisioning & Networking - Deploy EC2, ELB, Route53
  hosts: local
  gather_facts: true
  roles:
    - role: aws_nodes
      tags:
        - aws_nodes
        - provisioning
        - ec2
        - load_balancers
        - route53

- name: Bootstrap - Approve CSRs and wait for cluster operators
  hosts: local
  gather_facts: true
  roles:
    - role: csr_approver
      tags:
        - csr_approval
        - bootstrap

- name: Validation - Post-install health checks
  hosts: local
  gather_facts: true
  roles:
    - role: validation
      tags:
        - validation
