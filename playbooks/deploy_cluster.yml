---
# Gryphon Forge - Deploy OpenShift UPI cluster
# Transitions from "Empty VPC" to "Functional Cluster"

- name: Load foundry outputs
  hosts: local
  gather_facts: true
  tasks:
    - name: Check if foundry output exists
      ansible.builtin.stat:
        path: "{{ foundry_output_path | expanduser }}"
      register: foundry_output_stat
      tags:
        - always

    - name: Load foundry_output.json if present
      ansible.builtin.include_vars:
        file: "{{ foundry_output_path | expanduser }}"
        name: foundry
      when: foundry_output_stat.stat.exists | default(false)
      tags:
        - always

    # Foundry vars come from: 1) include_vars (foundry.*), 2) -e @foundry_output.json, 3) all.yml
    # Handles both flat and Terraform output format (nested .value)
    - name: Override with foundry outputs
      ansible.builtin.set_fact:
        foundry_vpc_id: >-
          {{ (((foundry | default({})).vault_vpc_id | default(vault_vpc_id)) | default({}))['value']
          | default((foundry | default({})).vault_vpc_id | default(vault_vpc_id) | default(foundry_vpc_id)) }}
        foundry_private_subnets: >-
          {{ (((foundry | default({})).vault_private_subnet_ids
          | default((foundry | default({})).ocp_upi_subnet_ids)
          | default(ocp_upi_subnet_ids)
          | default(vault_private_subnet_ids)
          | default(private_subnet_ids)) | default({}))['value']
          | default((foundry | default({})).vault_private_subnet_ids
          | default((foundry | default({})).ocp_upi_subnet_ids)
          | default(ocp_upi_subnet_ids)
          | default(vault_private_subnet_ids)
          | default(private_subnet_ids) | default(foundry_private_subnets)) }}
        foundry_bastion_security_group_id: >-
          {{ (((foundry | default({})).bastion_security_group_id
          | default(bastion_security_group_id)) | default({}))['value']
          | default((foundry | default({})).bastion_security_group_id
          | default(bastion_security_group_id) | default(foundry_bastion_security_group_id)) }}
        foundry_internal_hosted_zone_id: >-
          {{ (((foundry | default({})).internal_hosted_zone_id
          | default(internal_hosted_zone_id)) | default({}))['value']
          | default((foundry | default({})).internal_hosted_zone_id
          | default(internal_hosted_zone_id) | default(foundry_internal_hosted_zone_id)) }}
        foundry_region: >-
          {{ (((foundry | default({})).region
          | default((foundry | default({})).aws_region)
          | default(region)
          | default(aws_region)) | default({}))['value']
          | default((foundry | default({})).region
          | default((foundry | default({})).aws_region)
          | default(region)
          | default(aws_region) | default(foundry_region)) }}
        foundry_vault_vpc_cidr: >-
          {{ (((foundry | default({})).vault_vpc_cidr | default(vault_vpc_cidr)) | default({}))['value']
          | default((foundry | default({})).vault_vpc_cidr | default(vault_vpc_cidr) | default(foundry_vault_vpc_cidr) | default('10.1.0.0/16')) }}
        foundry_nest_vpc_cidr: >-
          {{ (((foundry | default({})).nest_vpc_cidr | default(nest_vpc_cidr)) | default({}))['value']
          | default((foundry | default({})).nest_vpc_cidr | default(nest_vpc_cidr) | default(foundry_nest_vpc_cidr) | default('')) }}
        foundry_bastion_host: >-
          {{ (((foundry | default({})).bastion_public_ip | default(bastion_public_ip)) | default({}))['value']
          | default((((foundry | default({})).bastion_public_dns | default(bastion_public_dns)) | default({}))['value'])
          | default((foundry | default({})).bastion_public_ip | default(bastion_public_ip))
          | default((foundry | default({})).bastion_public_dns | default(bastion_public_dns))
          | default('') }}
        foundry_rhcos_ami_id: >-
          {{ (((foundry | default({})).rhcos_ami_id | default(rhcos_ami_id)) | default({}))['value']
          | default((foundry | default({})).rhcos_ami_id | default(rhcos_ami_id) | default('')) }}
        foundry_ingress_certificate_arn: >-
          {{ (((foundry | default({})).ingress_certificate_arn | default({})) | default({}))['value']
          | default((foundry | default({})).ingress_certificate_arn | default('')) }}
        foundry_vault_api_security_group_id: >-
          {{ (((foundry | default({})).vault_api_security_group_id | default(vault_api_security_group_id)) | default({}))['value']
          | default((foundry | default({})).vault_api_security_group_id
          | default(vault_api_security_group_id) | default(foundry_vault_api_security_group_id) | default('')) }}
        foundry_vault_security_group_id: >-
          {{ (((foundry | default({})).vault_security_group_id | default(vault_security_group_id)) | default({}))['value']
          | default((foundry | default({})).vault_security_group_id
          | default(vault_security_group_id) | default(foundry_vault_security_group_id) | default('')) }}
        foundry_base_domain: >-
          {{ (((foundry | default({})).ocp_base_domain | default(ocp_base_domain)) | default({}))['value']
          | default((foundry | default({})).ocp_base_domain | default(ocp_base_domain) | default('')) }}
        foundry_cluster_name: >-
          {{ (((foundry | default({})).ocp_cluster_name | default(ocp_cluster_name)) | default({}))['value']
          | default((foundry | default({})).ocp_cluster_name | default(ocp_cluster_name) | default('')) }}
        mirror_registry_url: >-
          {{ ((foundry | default({})).mirror_registry_url | default({}))['value']
          | default((foundry | default({})).mirror_registry_url | default(mirror_registry_url) | default('')) }}
        mirror_registry_additional_trust_bundle: >-
          {{
            (
              ((foundry | default({})).mirror_registry_additional_trust_bundle | default({}))['value']
              | default((foundry | default({})).mirror_registry_additional_trust_bundle
              | default(mirror_registry_additional_trust_bundle) | default(''), true)
            )
            | default('', true)
          }}
        foundry_vault_amazon_provided_dns: >-
          {{
            (((foundry | default({})).vault_vpc_amazon_provided_dns | default(vault_vpc_amazon_provided_dns)) | default({}))['value']
            | default(
                (foundry | default({})).vault_vpc_amazon_provided_dns
                | default(vault_vpc_amazon_provided_dns)
                | default(foundry_vault_amazon_provided_dns)
                | default('')
              )
          }}
        foundry_ocp_api_int_fqdn: >-
          {{
            (((foundry | default({})).ocp_api_int_fqdn | default(ocp_api_int_fqdn)) | default({}))['value']
            | default(
                (foundry | default({})).ocp_api_int_fqdn
                | default(ocp_api_int_fqdn)
                | default(foundry_ocp_api_int_fqdn)
                | default('')
              )
          }}
        foundry_create_ocp_private_zone: >-
          {{
            (((foundry | default({})).create_ocp_private_zone | default(create_ocp_private_zone)) | default({}))['value']
            | default(
                (foundry | default({})).create_ocp_private_zone
                | default(create_ocp_private_zone)
                | default(foundry_create_ocp_private_zone)
                | default(false)
              )
          }}
        foundry_ocp_route53_zone_source: >-
          {{
            (((foundry | default({})).ocp_route53_zone_source | default(ocp_route53_zone_source)) | default({}))['value']
            | default(
                (foundry | default({})).ocp_route53_zone_source
                | default(ocp_route53_zone_source)
                | default(foundry_ocp_route53_zone_source)
                | default('')
              )
          }}
      tags:
        - always

    # Unwrap Terraform output format when passed via -e @foundry_output.json
    - name: Normalize mirror_registry_url when in Terraform output format
      ansible.builtin.set_fact:
        mirror_registry_url: "{{ mirror_registry_url['value'] }}"
      when:
        - mirror_registry_url is mapping
        - (mirror_registry_url | default({})).get('value') is defined
      tags:
        - always

    - name: Normalize mirror_registry_additional_trust_bundle when in Terraform output format
      ansible.builtin.set_fact:
        mirror_registry_additional_trust_bundle: "{{ mirror_registry_additional_trust_bundle['value'] | default('', true) }}"
      when:
        - mirror_registry_additional_trust_bundle is mapping
        - (mirror_registry_additional_trust_bundle | default({})).get('value') is defined
      tags:
        - always

    - name: Normalize ocp_base_domain when in Terraform output format
      ansible.builtin.set_fact:
        foundry_base_domain: "{{ foundry_base_domain['value'] }}"
      when:
        - foundry_base_domain is mapping
        - (foundry_base_domain | default({})).get('value') is defined
      tags:
        - always

    - name: Normalize ocp_cluster_name when in Terraform output format
      ansible.builtin.set_fact:
        foundry_cluster_name: "{{ foundry_cluster_name['value'] }}"
      when:
        - foundry_cluster_name is mapping
        - (foundry_cluster_name | default({})).get('value') is defined
      tags:
        - always

    # Override base_domain from foundry when foundry provides ocp_base_domain (ensures DNS zone alignment)
    - name: Override base_domain from foundry ocp_base_domain
      ansible.builtin.set_fact:
        base_domain: "{{ foundry_base_domain }}"
      when: foundry_base_domain | default('') | length > 0
      tags:
        - always

    # Override cluster_name from foundry when foundry provides ocp_cluster_name (aligns tags, LB names, install_dir)
    - name: Override cluster_name from foundry ocp_cluster_name
      ansible.builtin.set_fact:
        cluster_name: "{{ foundry_cluster_name }}"
      when: foundry_cluster_name | default('') | length > 0
      tags:
        - always

    # Normalize root-level vars when passed via -e @foundry_output.json (Terraform output format)
    - name: Normalize foundry_private_subnets when in Terraform output format
      ansible.builtin.set_fact:
        foundry_private_subnets: "{{ (vault_private_subnet_ids | default(ocp_upi_subnet_ids))['value'] }}"
      when:
        - (vault_private_subnet_ids | default(ocp_upi_subnet_ids) | default({})) is mapping
        - (vault_private_subnet_ids | default(ocp_upi_subnet_ids) | default({})).get('value') is defined
      tags:
        - always

    - name: Normalize rhcos_ami_id when in Terraform output format
      ansible.builtin.set_fact:
        rhcos_ami_id: "{{ rhcos_ami_id['value'] }}"
      when:
        - rhcos_ami_id is mapping
        - (rhcos_ami_id | default({})).get('value') is defined
      tags:
        - always

    - name: Normalize foundry_nest_vpc_cidr when in Terraform output format
      ansible.builtin.set_fact:
        foundry_nest_vpc_cidr: "{{ foundry_nest_vpc_cidr['value'] }}"
      when:
        - foundry_nest_vpc_cidr is mapping
        - (foundry_nest_vpc_cidr | default({})).get('value') is defined
      tags:
        - always

    - name: Normalize foundry_vault_vpc_cidr when in Terraform output format
      ansible.builtin.set_fact:
        foundry_vault_vpc_cidr: "{{ foundry_vault_vpc_cidr['value'] }}"
      when:
        - foundry_vault_vpc_cidr is mapping
        - (foundry_vault_vpc_cidr | default({})).get('value') is defined
      tags:
        - always

    - name: Normalize foundry_vault_api_security_group_id when in Terraform output format
      ansible.builtin.set_fact:
        foundry_vault_api_security_group_id: "{{ foundry_vault_api_security_group_id['value'] }}"
      when:
        - foundry_vault_api_security_group_id is mapping
        - (foundry_vault_api_security_group_id | default({})).get('value') is defined
      tags:
        - always

    - name: Normalize foundry_vault_security_group_id when in Terraform output format
      ansible.builtin.set_fact:
        foundry_vault_security_group_id: "{{ foundry_vault_security_group_id['value'] }}"
      when:
        - foundry_vault_security_group_id is mapping
        - (foundry_vault_security_group_id | default({})).get('value') is defined
      tags:
        - always

    - name: Normalize vault_vpc_amazon_provided_dns when in Terraform output format
      ansible.builtin.set_fact:
        foundry_vault_amazon_provided_dns: "{{ vault_vpc_amazon_provided_dns['value'] | default('', true) }}"
      when:
        - vault_vpc_amazon_provided_dns is defined
        - vault_vpc_amazon_provided_dns is mapping
        - (vault_vpc_amazon_provided_dns | default({})).get('value') is defined
      tags:
        - always

    - name: Normalize ocp_api_int_fqdn when in Terraform output format
      ansible.builtin.set_fact:
        foundry_ocp_api_int_fqdn: "{{ ocp_api_int_fqdn['value'] | default('', true) }}"
      when:
        - ocp_api_int_fqdn is defined
        - ocp_api_int_fqdn is mapping
        - (ocp_api_int_fqdn | default({})).get('value') is defined
      tags:
        - always

    - name: Normalize create_ocp_private_zone when in Terraform output format
      ansible.builtin.set_fact:
        foundry_create_ocp_private_zone: "{{ create_ocp_private_zone['value'] | default(false) | bool }}"
      when:
        - create_ocp_private_zone is defined
        - create_ocp_private_zone is mapping
        - (create_ocp_private_zone | default({})).get('value') is defined
      tags:
        - always

    - name: Normalize ocp_route53_zone_source when in Terraform output format
      ansible.builtin.set_fact:
        foundry_ocp_route53_zone_source: "{{ ocp_route53_zone_source['value'] | default('', true) }}"
      when:
        - ocp_route53_zone_source is defined
        - ocp_route53_zone_source is mapping
        - (ocp_route53_zone_source | default({})).get('value') is defined
      tags:
        - always

    - name: Coerce null foundry_internal_hosted_zone_id from Terraform JSON
      ansible.builtin.set_fact:
        foundry_internal_hosted_zone_id: ""
      when: (foundry_internal_hosted_zone_id is none) or ((foundry_internal_hosted_zone_id | string | lower) in ['none', 'null'])
      tags:
        - always

    # Infer region from sneakernet_kms_key_arn when foundry has no explicit region
    - name: Infer foundry_region from KMS ARN when not provided
      ansible.builtin.set_fact:
        foundry_region: "{{ (kms_arn_resolved | split(':'))[3] }}"
      vars:
        kms_arn_resolved: >-
          {{ (((foundry | default({})).sneakernet_kms_key_arn
          | default(sneakernet_kms_key_arn)) | default({}))['value']
          | default((foundry | default({})).sneakernet_kms_key_arn
          | default(sneakernet_kms_key_arn) | default('')) }}
      when:
        - foundry_region | length == 0
        - kms_arn_resolved is defined
        - kms_arn_resolved | length > 0
      tags:
        - always

    - name: Add bastion to inventory for API access
      ansible.builtin.add_host:
        name: bastion
        groups: bastion
        ansible_host: "{{ foundry_bastion_host }}"
        ansible_user: "{{ bastion_ssh_user }}"
        ansible_connection: ssh
        ansible_ssh_private_key_file: "{{ bastion_ssh_private_key_path | expanduser }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      when: foundry_bastion_host is defined and foundry_bastion_host | length > 0
      tags:
        - always

- name: Configuration - Define node counts and instance sizing
  hosts: local
  gather_facts: true
  tags:
    - config
    - ignition
  tasks:
    - name: Fail early when foundry output is missing
      ansible.builtin.fail:
        msg: >-
          Foundry outputs not loaded. Run gryphon-foundry first:
            cd ../gryphon-foundry && terraform apply -var-file=terraform.tfvars
            terraform output -json > foundry_output.json
          Then run: ansible-playbook playbooks/deploy_cluster.yml -e @../gryphon-foundry/foundry_output.json
          Or copy foundry_output.json to {{ foundry_output_path | expanduser }}
      when:
        - not (foundry_output_stat.stat.exists | default(false))
        - foundry_private_subnets | default([]) | length < 3

    - name: Validate configuration
      ansible.builtin.assert:
        that:
          - foundry_vpc_id | length > 0
          - foundry_private_subnets | length >= 3
          - foundry_region | length > 0
          - cluster_name | length > 0
          - base_domain | length > 0
        fail_msg: >-
          Missing required config (foundry_vpc_id, foundry_private_subnets (min 3), foundry_region, cluster_name, base_domain).
          Pass foundry outputs via: ansible-playbook playbooks/deploy_cluster.yml -e @../gryphon-foundry/foundry_output.json
      tags:
        - config
        - ignition

    - name: Validate foundry_nest_vpc_cidr when bastion is used
      ansible.builtin.assert:
        that: foundry_nest_vpc_cidr | default('') | length > 0
        fail_msg: >-
          foundry_nest_vpc_cidr is required when using bastion for API access. The bootstrap security group
          must allow port 6443 from the Nest VPC (where the bastion runs) for openshift-install to reach the API.
          Ensure gryphon-foundry outputs nest_vpc_cidr and pass via: -e @foundry_output.json
      when: foundry_bastion_host is defined and foundry_bastion_host | length > 0
      tags:
        - config
        - ignition

# Disconnected: confirm openshift_install_release_image_override exists on the mirror before openshift-install.
# Runs on bastion when foundry provides bastion (Vault can reach the private registry); otherwise the ignition role checks from the controller.
- name: Verify mirrored release image from bastion (preflight)
  hosts: bastion
  gather_facts: false
  tags:
    - ignition
    - config
  tasks:
    - name: Resolve mirror registry URL on localhost for preflight
      ansible.builtin.set_fact:
        ignition_preflight_mirror_url: >-
          {{ (hostvars['localhost']['mirror_registry_url']['value'] if (hostvars['localhost']['mirror_registry_url'] is mapping
             and (hostvars['localhost']['mirror_registry_url'] | default({})).get('value') is defined)
             else (hostvars['localhost']['mirror_registry_url'] | default(''))) | trim }}
      delegate_to: localhost
      connection: local
      run_once: true

    - name: Compute whether mirror preflight should run from bastion
      ansible.builtin.set_fact:
        ignition_mirror_preflight_should_run: >-
          {{ (hostvars['localhost']['ignition_preflight_mirror_url'] | default('') | length > 0)
             and (hostvars['localhost']['openshift_install_release_image_override'] | default('') | trim | length > 0)
             and (hostvars['localhost']['ignition_mirror_release_image_check_enabled'] | default(true) | bool) }}
      delegate_to: localhost
      connection: local
      run_once: true

    - name: Include mirror release image check from bastion  # noqa: var-naming[no-role-prefix]
      ansible.builtin.include_role:
        name: ignition
        tasks_from: mirror_release_image_check.yml
      vars:
        ignition_mirror_release_image_check_from_bastion: true
        openshift_install_release_image_override: "{{ hostvars['localhost']['openshift_install_release_image_override'] }}"
        pull_secret_path: "{{ hostvars['localhost']['pull_secret_path'] }}"
        install_dir: "{{ hostvars['localhost']['install_dir'] }}"
        mirror_registry_additional_trust_bundle: "{{ hostvars['localhost']['mirror_registry_additional_trust_bundle'] | default('') }}"
        bastion_install_dir: "{{ bastion_install_dir }}"
        ignition_mirror_release_image_check_result_path: "{{ hostvars['localhost']['install_dir'] }}/mirror-release-image-check.txt"
      when: hostvars['localhost']['ignition_mirror_preflight_should_run'] | default(false) | bool

- name: Ignition Generation - Fetch pull secrets and generate ignition files
  hosts: local
  gather_facts: true
  roles:
    - role: ignition
      tags:
        - ignition

- name: Provisioning & Networking - Deploy EC2, ELB, Route53
  hosts: local
  gather_facts: true
  roles:
    - role: aws_nodes
      tags:
        - aws_nodes
        - provisioning
        - ec2
        - ami_copy
        - load_balancers
        - route53
        - dns_gate

# Runs only when bastion was added via add_host (foundry provides bastion_public_ip/bastion_public_dns)
# Install *artifacts* rsync from controller (exclude bin/ + .forge-download-cache/). Bastion downloads
# Linux openshift-install + oc from the mirror below — never push controller binaries to the bastion.
# TMPDIR avoids /tmp (459MB tmpfs) - Ansible modules use /var/tmp for temp files
- name: Sync install directory to bastion for API access
  hosts: bastion
  gather_facts: true
  environment:
    TMPDIR: /var/tmp
  vars:
    # Foundry overrides apply to localhost in the first play; bastion must use the same identity for paths and DNS.
    cluster_name: "{{ hostvars['localhost']['cluster_name'] }}"
    base_domain: "{{ hostvars['localhost']['base_domain'] }}"
    forge_controller_install_dir: "{{ hostvars['localhost']['install_dir'] }}"
    # Use /var/tmp to avoid /tmp space limits (openshift-install tarball ~395MB)
    forge_bastion_tmp: "/var/tmp/gryphon-forge-ocp-tools"
  tasks:
    # Rsync over SSH runs as ansible_user; install_dir must be writable by that user. Use become so root
    # can create or chown paths that still belong to root from older playbook runs (ec2-user alone cannot).
    - name: Ensure bastion install directory exists
      ansible.builtin.file:
        path: "{{ bastion_install_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      become: true
      tags:
        - csr_approval
        - validation

    - name: Ensure bin directory exists on bastion
      ansible.builtin.file:
        path: "{{ bastion_install_dir }}/bin"
        state: directory
        mode: "0755"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      become: true
      tags:
        - csr_approval
        - validation

    # Descendants may still be root-owned from partial runs; recurse fixes the full tree for rsync.
    - name: Align ownership on bastion install dir for synchronize SSH user
      ansible.builtin.file:
        path: "{{ bastion_install_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: true
      become: true
      tags:
        - csr_approval
        - validation

    # ansible.posix.synchronize runs rsync on the Ansible controller and rsync --server on the bastion over SSH.
    # Minimal AMIs often omit rsync; install on bastion before sync. Controllers usually ship rsync (verify below).
    - name: Ensure rsync is installed on bastion (remote rsync helper for synchronize)
      ansible.builtin.package:
        name: rsync
        state: present
      become: true
      tags:
        - csr_approval
        - validation

    - name: Verify rsync is available on Ansible controller (synchronize invokes local rsync)
      ansible.builtin.stat:
        path: "{{ item }}"
      register: forge_controller_rsync_stat
      delegate_to: localhost
      connection: local
      run_once: true
      loop:
        - /usr/bin/rsync
        - /bin/rsync
      tags:
        - csr_approval
        - validation

    - name: Require rsync on Ansible controller for synchronize
      ansible.builtin.assert:
        that:
          - forge_controller_rsync_stat.results | selectattr('stat.exists', 'equalto', true) | list | length > 0
        fail_msg: >-
          rsync is required on the Ansible controller for ansible.posix.synchronize (install rsync on this machine).
          Examples: dnf install rsync / apt install rsync; macOS includes /usr/bin/rsync by default.
      tags:
        - csr_approval
        - validation

    - name: Rsync install artifacts to bastion (exclude controller bin and download cache)
      vars:
        # Raw path from inventory / -e (may be relative to where ansible-playbook was started).
        _forge_bastion_pk: "{{ hostvars[inventory_hostname]['ansible_ssh_private_key_file'] | default(bastion_ssh_private_key_path, true) }}"
        _forge_bastion_pk_expanded: "{{ _forge_bastion_pk | expanduser }}"
      ansible.posix.synchronize:
        src: "{{ forge_controller_install_dir | expanduser }}/"
        dest: "{{ bastion_install_dir }}/"
        archive: true
        delete: false
        times: false
        # delegate_to: localhost uses a local connection; rsync's ssh must get the bastion key explicitly.
        # Relative paths must be absolute: rsync's subprocess cwd is not the project directory (ssh -i would fail).
        private_key: >-
          {{
            (_forge_bastion_pk_expanded | normpath)
            if (_forge_bastion_pk_expanded | regex_search('^/'))
            else ([playbook_dir | dirname, _forge_bastion_pk_expanded] | path_join | normpath)
          }}
        rsync_opts:
          - "--exclude=bin/"
          - "--exclude=.forge-download-cache/"
      delegate_to: localhost
      tags:
        - csr_approval
        - validation

    # Bastion SSH uses bastion_ssh_private_key_path (ec2-user). Bootstrap/RHCOS core uses the key
    # embedded in install-config (ssh_public_key_path); copy its private half for gather / manual SSH.
    - name: Stat OCP SSH private key on Ansible controller
      ansible.builtin.stat:
        path: "{{ ocp_ssh_private_key_path | expanduser }}"
      register: forge_ocp_ssh_key_stat
      delegate_to: localhost
      connection: local
      run_once: true
      tags:
        - csr_approval
        - validation

    # ansible.cfg enables become globally; without owner/group this dir/file end up root:root
    # (mode 0700/0600) and ec2-user cannot use -i for manual SSH to bootstrap as core.
    - name: Ensure OCP SSH key directory on bastion
      ansible.builtin.file:
        path: "{{ bastion_install_dir }}/.ocp-ssh"
        state: directory
        mode: "0700"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      when: forge_ocp_ssh_key_stat.stat.exists | default(false)
      tags:
        - csr_approval
        - validation

    - name: Copy OCP cluster SSH private key to bastion (matches install-config sshKey)
      ansible.builtin.copy:
        src: "{{ ocp_ssh_private_key_path | expanduser }}"
        dest: "{{ bastion_install_dir }}/.ocp-ssh/identity"
        mode: "0600"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      when: forge_ocp_ssh_key_stat.stat.exists | default(false)
      tags:
        - csr_approval
        - validation

    - name: Warn when OCP SSH private key is missing on controller
      ansible.builtin.debug:
        msg: >-
          No private key at {{ ocp_ssh_private_key_path | expanduser }} (expected to pair with ssh_public_key_path).
          Set OCP_SSH_PRIVATE_KEY_PATH or align keys. Manual SSH to bootstrap as core and gather bootstrap may fail
          unless keys exist under ec2-user ~/.ssh on the bastion.
      when: not forge_ocp_ssh_key_stat.stat.exists | default(false)
      tags:
        - csr_approval
        - validation

    # Rsync excludes bin/; populate Linux openshift-install + oc from mirror below.
    - name: Decide if bastion needs Linux openshift-install and oc from mirror
      ansible.builtin.shell: |
        set -euo pipefail
        f="{{ bastion_install_dir }}/bin/openshift-install"
        o="{{ bastion_install_dir }}/bin/oc"
        elf_hdr() {
          h=$(head -c 4 "$1" | od -An -t x1 | tr -d '[:space:]')
          case "$h" in 7f454c46*) return 0;; *) return 1;; esac
        }
        if [ ! -f "$f" ] || [ ! -f "$o" ]; then
          echo need
          exit 0
        fi
        if elf_hdr "$f" && elf_hdr "$o"; then
          echo skip
        else
          echo need
        fi
      register: forge_bastion_ocp_tools_plan
      changed_when: false
      tags:
        - csr_approval
        - validation

    - name: Ensure temp directory for OCP tools download
      ansible.builtin.file:
        path: "{{ forge_bastion_tmp }}"
        state: directory
        mode: "0700"
      when: (forge_bastion_ocp_tools_plan.stdout | trim) == 'need'
      tags:
        - csr_approval
        - validation

    - name: Download openshift-install from Red Hat mirror
      ansible.builtin.get_url:
        url: "{{ forge_ocp_installer_url_linux }}"
        dest: "{{ forge_bastion_tmp }}/openshift-install-linux.tar.gz"
        mode: "0644"
        validate_certs: "{{ forge_ocp_mirror_validate_certs | default(true) | bool }}"
      when: (forge_bastion_ocp_tools_plan.stdout | trim) == 'need'
      tags:
        - csr_approval
        - validation

    - name: Extract openshift-install
      ansible.builtin.unarchive:
        src: "{{ forge_bastion_tmp }}/openshift-install-linux.tar.gz"
        dest: "{{ forge_bastion_tmp }}"
        remote_src: true
      when: (forge_bastion_ocp_tools_plan.stdout | trim) == 'need'
      tags:
        - csr_approval
        - validation

    - name: Install openshift-install binary to bin directory
      ansible.builtin.shell: |
        BIN=$(find {{ forge_bastion_tmp }} -name 'openshift-install' -type f 2>/dev/null | head -1)
        cp "$BIN" {{ bastion_install_dir }}/bin/openshift-install
        chmod 0755 {{ bastion_install_dir }}/bin/openshift-install
      when: (forge_bastion_ocp_tools_plan.stdout | trim) == 'need'
      tags:
        - csr_approval
        - validation

    - name: Free space before openshift-client download
      ansible.builtin.shell: |
        rm -f {{ forge_bastion_tmp }}/openshift-install-linux.tar.gz
        find {{ forge_bastion_tmp }} -name 'openshift-install' -type f -delete
      when: (forge_bastion_ocp_tools_plan.stdout | trim) == 'need'
      tags:
        - csr_approval
        - validation

    - name: Download openshift-client from Red Hat mirror
      ansible.builtin.get_url:
        url: "{{ forge_ocp_client_url_linux }}"
        dest: "{{ forge_bastion_tmp }}/openshift-client-linux.tar.gz"
        mode: "0644"
        validate_certs: "{{ forge_ocp_mirror_validate_certs | default(true) | bool }}"
      when: (forge_bastion_ocp_tools_plan.stdout | trim) == 'need'
      tags:
        - csr_approval
        - validation

    - name: Extract openshift-client
      ansible.builtin.unarchive:
        src: "{{ forge_bastion_tmp }}/openshift-client-linux.tar.gz"
        dest: "{{ forge_bastion_tmp }}"
        remote_src: true
      when: (forge_bastion_ocp_tools_plan.stdout | trim) == 'need'
      tags:
        - csr_approval
        - validation

    - name: Install oc binary to bin directory
      ansible.builtin.shell: |
        BIN=$(find {{ forge_bastion_tmp }} -name 'oc' -type f 2>/dev/null | head -1)
        cp "$BIN" {{ bastion_install_dir }}/bin/oc
        chmod 0755 {{ bastion_install_dir }}/bin/oc
      when: (forge_bastion_ocp_tools_plan.stdout | trim) == 'need'
      tags:
        - csr_approval
        - validation

    - name: Ensure oc-mirror on bastion matches OCP mirror channel
      ansible.builtin.include_role:
        name: ignition
        tasks_from: ensure_oc_mirror_install.yml
      vars:
        ignition_oc_mirror_target_bin_dir: "{{ bastion_install_dir }}/bin"
        ignition_oc_mirror_download_tmp: "/var/tmp/gryphon-forge-oc-mirror-dl-{{ cluster_name }}"
      when: forge_oc_mirror_install_enabled | default(true) | bool
      tags:
        - csr_approval
        - validation

    - name: Remove temp directory
      ansible.builtin.file:
        path: "{{ forge_bastion_tmp }}"
        state: absent
      when: (forge_bastion_ocp_tools_plan.stdout | trim) == 'need'
      tags:
        - csr_approval
        - validation
  tags:
    - csr_approval
    - validation

# Bootstrap EC2 is not removed by this playbook until openshift-install wait-for bootstrap-complete succeeds (csr_approver).
- name: Bootstrap - Approve CSRs and wait for cluster operators
  hosts: "{{ 'bastion' if ((hostvars['localhost'] | default({})).get('foundry_bastion_host', '') | length > 0) else 'local' }}"
  gather_facts: true
  vars:
    cluster_name: "{{ hostvars['localhost']['cluster_name'] }}"
    base_domain: "{{ hostvars['localhost']['base_domain'] }}"
    foundry_region: "{{ hostvars['localhost']['foundry_region'] | default('', true) }}"
    forge_api_install_dir: "{{ bastion_install_dir if ((hostvars['localhost'] | default({})).get('foundry_bastion_host', '') | length > 0) else install_dir }}"
    forge_use_bastion_bins: "{{ (hostvars['localhost'] | default({})).get('foundry_bastion_host', '') | length > 0 }}"
  roles:
    - role: csr_approver
      vars:
        csr_approver_install_dir: "{{ forge_api_install_dir }}"
        csr_approver_openshift_install_cmd: >-
          {{ forge_api_install_dir ~ '/bin/openshift-install' if forge_use_bastion_bins
             else (hostvars['localhost']['openshift_install_cmd'] | default('openshift-install')) }}
        csr_approver_oc_cmd: >-
          {{ forge_api_install_dir ~ '/bin/oc' if forge_use_bastion_bins
             else (hostvars['localhost']['openshift_client_cmd'] | default('oc')) }}
        csr_approver_ocp_ssh_identity_path: >-
          {{ bastion_install_dir ~ '/.ocp-ssh/identity' if forge_use_bastion_bins else '' }}
      tags:
        - csr_approval
        - bootstrap

- name: Validation - Post-install health checks
  hosts: "{{ 'bastion' if ((hostvars['localhost'] | default({})).get('foundry_bastion_host', '') | length > 0) else 'local' }}"
  gather_facts: true
  vars:
    cluster_name: "{{ hostvars['localhost']['cluster_name'] }}"
    base_domain: "{{ hostvars['localhost']['base_domain'] }}"
    forge_api_install_dir: "{{ bastion_install_dir if ((hostvars['localhost'] | default({})).get('foundry_bastion_host', '') | length > 0) else install_dir }}"
    forge_use_bastion_bins: "{{ (hostvars['localhost'] | default({})).get('foundry_bastion_host', '') | length > 0 }}"
  roles:
    - role: validation
      vars:
        validation_install_dir: "{{ forge_api_install_dir }}"
        validation_oc_cmd: >-
          {{ forge_api_install_dir ~ '/bin/oc' if forge_use_bastion_bins
             else (hostvars['localhost']['openshift_client_cmd'] | default('oc')) }}
      tags:
        - validation
