---
# Optional: validate gryphon-foundry JSON before a full deploy.
#
#   ansible-playbook playbooks/preflight.yml -i inventory/hosts.yml \
#     -e foundry_preflight_path=../gryphon-foundry/foundry_output.json
#
# Or set foundry_output_path in inventory/group_vars/all.yml to point at the file and omit -e.

- name: Validate foundry output JSON for Gryphon Forge
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Resolve path to foundry JSON
      vars:
        # Relative paths anchor to gryphon-forge repo root (playbook_dir/..), not the shell cwd, so the same
        # -e foundry_preflight_path=../gryphon-foundry/foundry_output.json works from repo root or playbooks/.
        _preflight_raw: >-
          {{
            (foundry_preflight_path
            | default(foundry_output_path | default('../gryphon-foundry/foundry_output.json')))
            | expanduser
          }}
      ansible.builtin.set_fact:
        preflight_foundry_file: >-
          {{
            _preflight_raw if _preflight_raw.startswith('/')
            else (playbook_dir ~ '/../' ~ _preflight_raw)
          }}

    - name: Stat foundry JSON
      ansible.builtin.stat:
        path: "{{ preflight_foundry_file }}"
      register: preflight_foundry_stat

    - name: Require foundry JSON file
      ansible.builtin.fail:
        msg: >-
          No foundry JSON at {{ preflight_foundry_file }}.
          Example: ansible-playbook playbooks/preflight.yml -i inventory/hosts.yml
          -e foundry_preflight_path=../gryphon-foundry/foundry_output.json
      when: not preflight_foundry_stat.stat.exists | default(false)

    - name: Load foundry JSON
      ansible.builtin.include_vars:
        file: "{{ preflight_foundry_file }}"
        name: preflight_ff

    - name: Derive Terraform-wrapped or flat values
      ansible.builtin.set_fact:
        preflight_nest_cidr: >-
          {{ (preflight_ff.nest_vpc_cidr | default({}))['value']
          | default(preflight_ff.nest_vpc_cidr | default('')) }}
        preflight_bastion_ip: >-
          {{ (preflight_ff.bastion_public_ip | default({}))['value']
          | default(preflight_ff.bastion_public_ip | default('')) }}
        preflight_subnets: >-
          {{ (preflight_ff.vault_private_subnet_ids | default(preflight_ff.ocp_upi_subnet_ids | default({})))['value']
          | default(preflight_ff.vault_private_subnet_ids | default(preflight_ff.ocp_upi_subnet_ids | default([]))) }}
        preflight_zone_id: >-
          {{ (preflight_ff.internal_hosted_zone_id | default({}))['value']
          | default(preflight_ff.internal_hosted_zone_id | default('')) }}
        preflight_vpc_id: >-
          {{ (preflight_ff.vault_vpc_id | default({}))['value']
          | default(preflight_ff.vault_vpc_id | default('')) }}
        preflight_region: >-
          {{ (preflight_ff.region | default({}))['value']
          | default(preflight_ff.region | default('')) }}

    - name: Assert UPI subnet count
      ansible.builtin.assert:
        that:
          - preflight_subnets | length >= 3
        fail_msg: >-
          Need at least 3 vault private subnets in foundry output (vault_private_subnet_ids or ocp_upi_subnet_ids);
          got {{ preflight_subnets | length }}.

    - name: Assert core identifiers
      ansible.builtin.assert:
        that:
          - preflight_vpc_id | length > 0
          - preflight_zone_id | length > 0
          - preflight_region | length > 0
        fail_msg: >-
          foundry JSON must include vault_vpc_id, internal_hosted_zone_id, and region (Terraform .value form OK).

    - name: Assert nest_vpc_cidr when bastion is defined (bootstrap API from Nest)
      ansible.builtin.assert:
        that:
          - preflight_nest_cidr | length > 0
        fail_msg: >-
          bastion_public_ip is set but nest_vpc_cidr is missing or empty. Forge opens bootstrap 6443/22623 to this
          CIDR so openshift-install on the bastion can reach the API NLB over VPC peering.
      when: preflight_bastion_ip | length > 0
