---
# OpenShift UPI cluster in the Vault
# Consumes gryphon-foundry outputs for VPC/subnet placement

all:
  children:
    local:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"

    bootstrap:
      hosts: {}

    masters:
      hosts: {}

    workers:
      hosts: {}

    gpu_workers:
      hosts: {}

  vars:
    ansible_user: ec2-user
