---
# Gryphon Forge - Global variables
#
# Foundry outputs (vpc, subnets, sg, hosted zone, region) MUST come from one of:
#   1. foundry_output.json at foundry_output_path (auto-loaded if present)
#   2. -e @foundry_output.json (recommended: no edits to this file)
#   3. -e foundry_output_path=/path/to/foundry_output.json
#
# Example: ansible-playbook playbooks/deploy_cluster.yml -e @../foundry_output.json

# --- Foundry Outputs (defaults; override via foundry_output.json or -e) ---
foundry_vpc_id: ""
foundry_private_subnets: []
foundry_rhcos_ami_id: ""  # Option B: RHCOS AMI imported by foundry from mirror.openshift.com
foundry_vault_vpc_cidr: "10.1.0.0/16"  # Vault VPC CIDR; used for install-config networking.machineNetwork
foundry_nest_vpc_cidr: ""  # Nest VPC CIDR; when bastion is in Nest, allows API/MCS from bastion via peering
foundry_bastion_security_group_id: ""
foundry_internal_hosted_zone_id: ""
foundry_base_domain: ""  # From foundry ocp_base_domain; when set, overrides base_domain for DNS zone alignment
ocp_cluster_name: ""  # From foundry ocp_cluster_name; deploy_cluster maps to cluster_name when set
foundry_region: ""
foundry_ingress_certificate_arn: ""  # ACM cert ARN from foundry; when set, uses ALB with HTTPS

# --- Cluster Configuration ---
cluster_name: "iron-vault-01"
base_domain: "fsi.internal"
ocp_version: "4.20"

# --- Node Counts ---
master_count: 3
worker_count: 3
gpu_worker_count: 1

# --- Instance Sizing ---
master_instance_type: "m6i.xlarge"
worker_instance_type: "m6i.2xlarge"
gpu_worker_instance_type: "g5.xlarge"

# --- Paths ---
install_dir: "{{ playbook_dir | default('.') }}/../installer/{{ cluster_name }}"
foundry_output_path: "{{ playbook_dir | default('.') }}/../foundry_output.json"

# --- Pull Secret ---
# Path to Red Hat pull secret JSON. Retrieve from:
#   https://console.redhat.com/openshift/install/aws/installer-provisioned
#   → Log in → Download pull secret → Save to ~/.openshift/pull-secret
# Override via: PULL_SECRET_PATH environment variable
pull_secret_path: "{{ lookup('env', 'PULL_SECRET_PATH') | default('~/.openshift/pull-secret', true) }}"

# --- SSH Key ---
ssh_public_key_path: "{{ lookup('env', 'SSH_PUBLIC_KEY_PATH') | default('~/.ssh/id_rsa.pub', true) }}"
# Private key for RHCOS user core (must match ssh_public_key_path / install-config sshKey).
# Copied to bastion at bastion_install_dir/.ocp-ssh/identity when using a bastion. Override: OCP_SSH_PRIVATE_KEY_PATH.
ocp_ssh_private_key_path: "{{ lookup('env', 'OCP_SSH_PRIVATE_KEY_PATH') | default(ssh_public_key_path | regex_replace('\\.pub$', ''), true) }}"

# --- Bastion (for API access; populated from foundry, no hardcoding) ---
# When foundry provides bastion_public_ip/bastion_public_dns, install_dir is synced
# to bastion and CSR approval/validation run there (reach cluster API in private VPC).
# Use /var/tmp (not /tmp) - bastion /tmp is often tmpfs (~459MB) with insufficient space
# for install dir + OCP tools (~800MB). Override via -e bastion_install_dir=... if needed.
bastion_install_dir: "/var/tmp/gryphon-forge-install/{{ cluster_name }}"
bastion_ssh_user: "ec2-user"
bastion_ssh_private_key_path: "{{ lookup('env', 'BASTION_SSH_KEY_PATH') | default('~/.ssh/' + (ec2_key_name | default('id_rsa', true)) + '.pem', true) }}"

# --- EC2 (required for provisioning; auto-generated when empty) ---
ec2_key_name: ""  # AWS key pair name - auto-created as {{ cluster_name }}-forge-key when empty
rhcos_ami_id: ""  # RHCOS AMI - auto-fetched, copied from source, or set manually
# For disconnected/locked-down AWS (cannot use Red Hat AMI directly): copy from a source AMI
# you have access to (shared with your account or from another region). Set rhcos_ami_source_id.
rhcos_ami_source_id: ""  # When set, copy this AMI into your account (Option 1 for disconnected)
rhcos_ami_source_region: ""  # Source region for copy; defaults to foundry_region when empty

# --- API/Ingress Endpoints ---
api_dns_name: "api.{{ cluster_name }}.{{ base_domain }}"
api_int_dns_name: "api-int.{{ cluster_name }}.{{ base_domain }}"
ingress_dns_name: "*.apps.{{ cluster_name }}.{{ base_domain }}"

# --- Disconnected Install (mirror registry) ---
# When set, install-config gets imageContentSources and ICSP manifest for air-gapped install.
# Workflow: run oc-mirror on an internet-connected host → mirror or disk → transfer into env →
# push to mirror registry reachable from Vault. See Red Hat "Mirroring images for a disconnected installation".
mirror_registry_url: ""  # e.g. mirror.fsi.internal or mirror.fsi.internal:443
mirror_registry_release_path: "openshift/release"  # Path where oc-mirror stores release images
# PEM for the registry CA (or self-signed server cert). Required when the mirror is not in the system trust store.
# The serving certificate MUST include Subject Alternative Names (DNS names clients use); CN-only certs fail on RHCOS (Go TLS).
# Generate with: scripts/generate-mirror-registry-tls.sh mirror.fsi.internal
mirror_registry_additional_trust_bundle: ""
# REQUIRED when mirror_registry_url is set (enforced at ignition): exact payload on your mirror (digest recommended).
# 1) Mirror the release for your openshift-install build (same patch level as forge_ocp_mirror_channel / downloaded binary):
#    oc adm release mirror -a ~/.docker/config.json \
#      --from=quay.io/openshift-release-dev/ocp-release:<VERSION>-x86_64 \
#      --to=<mirror_registry_url>/<mirror_registry_release_path> \
#      --to-release-image=<mirror_registry_url>/<mirror_registry_release_path>:<VERSION>-x86_64
#    (or use oc-mirror; record imageContentSources / digest from the tool output.)
# 2) Set this variable to the mirrored release image reference, typically --to-release-image or digest form, e.g.:
#    openshift_install_release_image_override: "mirror.fsi.internal/openshift/release@sha256:..."
# 3) Confirm: openshift-install version default release image matches this payload.
openshift_install_release_image_override: ""
# When mirror + override are set: verify digest with oc image info before openshift-install (bastion if present, else controller).
ignition_mirror_release_image_check_enabled: true
# Default: {{ install_dir }}/mirror-release-image-check.txt on the controller; set to override path.
ignition_mirror_release_image_check_result_path: ""
# When true (default): list tags on mirror openshift/release, pick highest X.Y.Z-<arch> for ocp_version minor,
# set openshift_install_release_image_override to registry/path:tag. Conflicts with manual override; requires jq (+ curl or skopeo). Set false to pin openshift_install_release_image_override manually.
ignition_mirror_discover_release_tag: true
ignition_mirror_discover_release_arch: x86_64
ignition_mirror_discover_delegate_to_bastion: true
# Optional: extra imageContentSources / ICSP entries from oc-mirror output (operators, etc.).
# Format: [ { source: 'registry.redhat.io/foo/bar', mirrors: ['mirror.fsi.internal/...'] }, ... ]
mirror_registry_extra_image_content_sources: []

# --- Bastion OCP tools (download from mirror; override for air-gapped/internal mirror) ---
# When bastion has internet, it downloads openshift-install and oc from Red Hat mirror.
# Use latest-4.x for latest patch in minor version; or exact version e.g. 4.20.16
forge_ocp_mirror_channel: "latest-{{ ocp_version }}"
forge_ocp_mirror_base_url: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp"
# get_url SSL verify (Linux/non-macOS controller only; macOS uses /usr/bin/curl for mirror downloads).
# Set false only if mirror TLS fails (e.g. corporate PKI). Prefer fixing the controller CA store.
forge_ocp_mirror_validate_certs: true
# Same URLs used by the ignition role on the controller so install state matches bastion binaries.
forge_ocp_installer_url_linux: "{{ forge_ocp_mirror_base_url }}/{{ forge_ocp_mirror_channel }}/openshift-install-linux.tar.gz"
forge_ocp_client_url_linux: "{{ forge_ocp_mirror_base_url }}/{{ forge_ocp_mirror_channel }}/openshift-client-linux.tar.gz"
# Controller: leave empty to auto-download openshift-install + oc into install_dir/bin (Linux/macOS).
# Set both to absolute paths for air-gapped controllers or unsupported OS.
openshift_install_binary_path: ""
openshift_client_binary_path: ""
